      required: [id, status, total, currency, paymentMethod, dateCreated, lineItems]
      properties:
        id:
          type: integer
        status:
          type: string
        total:
          type: string
        currency:
          type: string
        paymentMethod:
          type: string
        dateCreated:
          type: string
          format: date-time
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/UcCustomerOrderItem"

    UcCustomerTicket:
      type: object
      required: [id, productModel, issueDescription, status, createdAt]
      properties:
        id:
          type: string
        productModel:
          type: string
        issueDescription:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    UcCustomerDetail:
      type: object
      required: [customer, orders, tickets]
      properties:
        customer:
          type: object
          required: [id, email, firstName, lastName, name, phone, joinedAt, authProvider, emailVerified, phoneVerified, recoveryChannels]
          properties:
            id:
              type: integer
            email:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            name:
              type: string
            phone:
              type: string
            joinedAt:
              type: string
              format: date-time
            authProvider:
              type: string
            emailVerified:
              type: boolean
              description: Explicit verification state; false means the destination must not be treated as verified.
            phoneVerified:
              type: boolean
              description: Explicit verification state; false means the destination must not be treated as verified.
            recoveryChannels:
              type: object
              required: [email, whatsapp]
              properties:
                email:
                  type: object
                  required: [available, verified]
                  properties:
                    available: { type: boolean }
                    verified: { type: boolean }
                whatsapp:
                  type: object
                  required: [available, verified, status]
                  properties:
                    available: { type: boolean }
                    verified: { type: boolean }
                    status:
                      type: string
                      description: Current WhatsApp connection state; contains no session or QR material.
        orders:
          type: array
          items:
            $ref: "#/components/schemas/UcCustomerOrder"
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/UcCustomerTicket"

    UcCustomersCount:
      type: object
      required: [count, newThisWeek, newThisMonth]
      properties:
        count:
          type: integer
          description: Total registered (non-deleted) UC Companion customers
        newThisWeek:
          type: integer
          description: Customers who registered since the start of the current calendar week
        newThisMonth:
          type: integer
          description: Customers who registered since the start of the current calendar month

    UcTemporaryPasswordInput:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [email, whatsapp]

    UcTemporaryPasswordResult:
      type: object
      required: [ok, temporaryPassword, expiresAt, delivery]
      properties:
        ok:
          type: boolean
        temporaryPassword:
          type: string
          description: Plaintext credential shown only in this issuance response
        expiresAt:
          type: string
          format: date-time
        delivery:
          type: object
          required: [channel, delivered]
          properties:
            channel:
              type: string
              enum: [email, whatsapp]
            delivered:
              type: boolean

    PublicActionableError:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          enum:
            - INSUFFICIENT_PERMISSION
            - ACCOUNT_INELIGIBLE
            - UNAVAILABLE_UNVERIFIED_DESTINATION
            - WHATSAPP_DISCONNECTED
            - DELIVERY_PROVIDER_FAILURE
        error:
          type: string

    UcLocation:
      type: object
      required: [id, type, name, address, lat, lng, hours, active, verified, countryIso]
      properties:
        id: { type: string }
        type: { type: string, enum: [experience_centre, refill_atm, vendor, water_atm, refill_station, city_tap] }
        name: { type: string }
        address: { type: string }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        hours: { type: string }
        phone: { type: [string, "null"] }
        vendorName: { type: [string, "null"] }
        countryIso: { type: string, pattern: "^[A-Z]{2}$" }
        city: { type: [string, "null"], maxLength: 120 }
        accessNotes: { type: [string, "null"], maxLength: 1000 }
        municipal: { type: [string, "null"], maxLength: 200 }
        sourceAttribution: { type: [string, "null"], maxLength: 500 }
        lastFieldVerifiedOn: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        nextReviewOn: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        active: { type: boolean }
        verified: { type: boolean }

    UcLocationRatingInput:
      type: object
      required: [waterQuality, cleanliness, equipmentCondition, serviceReliability, safetyConfidence]
      properties:
        waterQuality: { type: integer, minimum: 1, maximum: 5 }
        cleanliness: { type: integer, minimum: 1, maximum: 5 }
        equipmentCondition: { type: integer, minimum: 1, maximum: 5 }
        serviceReliability: { type: integer, minimum: 1, maximum: 5 }
        safetyConfidence: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"], maxLength: 1000 }
    UcLocationRatingAggregate:
      type: object
      required: [locationId, page, limit, count, averages, ratings]
      properties:
        locationId: { type: string }
        page: { type: integer }
        limit: { type: integer }
        count: { type: integer }
        averages: { type: object, additionalProperties: { type: number } }
        ratings:
          type: array
          items:
            type: object
            required: [id, waterQuality, cleanliness, equipmentCondition, serviceReliability, safetyConfidence, createdAt, updatedAt]
            properties:
              id: { type: string }
              waterQuality: { type: integer, minimum: 1, maximum: 5 }
              cleanliness: { type: integer, minimum: 1, maximum: 5 }
              equipmentCondition: { type: integer, minimum: 1, maximum: 5 }
              serviceReliability: { type: integer, minimum: 1, maximum: 5 }
              safetyConfidence: { type: integer, minimum: 1, maximum: 5 }
              comment: { type: [string, "null"], maxLength: 1000 }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }

    UcLocationInput:
      type: object
      required: [type, name, address, latitude, longitude, hours]
      properties:
        type: { type: string, enum: [experience_centre, refill_atm, vendor, water_atm, refill_station, city_tap] }
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        hours: { type: string, minLength: 1 }
        phone: { type: [string, "null"] }
        vendorName: { type: [string, "null"] }
        countryIso: { type: string, pattern: "^[A-Z]{2}$" }
        city: { type: [string, "null"], maxLength: 120 }
        accessNotes: { type: [string, "null"], maxLength: 1000 }
        municipal: { type: [string, "null"], maxLength: 200 }
        sourceAttribution: { type: [string, "null"], maxLength: 500 }
        lastFieldVerifiedOn: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        nextReviewOn: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }

    UcLocationAssessmentInput:
      type: object
      required: [waterQuality, cleanliness, equipmentCondition, serviceReliability, safetyConfidence]
      properties:
        waterQuality: { type: integer, minimum: 1, maximum: 5 }
        cleanliness: { type: integer, minimum: 1, maximum: 5 }
        equipmentCondition: { type: integer, minimum: 1, maximum: 5 }
        serviceReliability: { type: integer, minimum: 1, maximum: 5 }
        safetyConfidence: { type: integer, minimum: 1, maximum: 5 }
        checks:
          type: object
          additionalProperties: {}
        notes: { type: string, nullable: true, maxLength: 2000 }

    UcLocationAssessment:
      type: object
      required: [id, locationId, assessorId, waterQuality, cleanliness, equipmentCondition, serviceReliability, safetyConfidence, checks, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        locationId: { type: string }
        assessorId: { type: string }
        waterQuality: { type: integer, minimum: 1, maximum: 5 }
        cleanliness: { type: integer, minimum: 1, maximum: 5 }
        equipmentCondition: { type: integer, minimum: 1, maximum: 5 }
        serviceReliability: { type: integer, minimum: 1, maximum: 5 }
        safetyConfidence: { type: integer, minimum: 1, maximum: 5 }
        checks: { type: string }
        notes: { type: string, nullable: true }
        status: { type: string }
        verifiedAt: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }

    UcLocationUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        active: { type: boolean }
        type: { type: string, enum: [experience_centre, refill_atm, vendor, water_atm, refill_station, city_tap] }
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        hours: { type: string, minLength: 1 }
        phone: { type: [string, "null"] }
        vendorName: { type: [string, "null"] }
        countryIso: { type: string, pattern: "^[A-Z]{2}$" }
        city: { type: [string, "null"], maxLength: 120 }
        accessNotes: { type: [string, "null"], maxLength: 1000 }
        municipal: { type: [string, "null"], maxLength: 200 }
        sourceAttribution: { type: [string, "null"], maxLength: 500 }
        lastFieldVerifiedOn: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        nextReviewOn: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }

    UnsyncedRegistration:
      type: object
      required: [email, phone, recordedAt, dbPersisted]
      properties:
        id: { type: [integer, "null"] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        authProvider: { type: string }
        recordedAt: { type: string, format: date-time }
        dbPersisted: { type: boolean }
        recoveryStatus: { type: string, enum: [pending, blocked, resolved, retryable] }
        recoveryReason: { type: string, enum: [email_conflict, phone_conflict, invalid_phone] }
        targetAccountId: { type: integer }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string }

    UnsyncedRegistrationRecoveryInput:
      type: object
      required: [originalEmail, recordedAt, target]
      properties:
        originalEmail: { type: string, minLength: 1 }
        originalPhone: { type: string }
        correctedEmail: { type: string, minLength: 1 }
        correctedPhone: { type: string }
        recordedAt: { type: string, format: date-time }
        target:
          oneOf:
            - type: object
              required: [type, accountId]
              properties:
                type: { type: string, enum: [existing] }
                accountId: { type: integer, minimum: 1 }
            - type: object
              required: [type]
              properties:
                type: { type: string, enum: [new] }
        targetAccountId: { type: integer, minimum: 1, description: Backward-compatible shorthand for an existing target }
        createAccount: { type: boolean, description: Explicitly choose a new account }

    UcPermanentPasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
        currentPassword:
          type: string

    UcPasswordChangeResult:
      type: object
      required: [ok, token, user]
      properties:
        ok:
          type: boolean
        token:
          type: string
        user:
          type: object
          required: [id, email, mustChangePassword]
          properties:
            id:
              type: integer
            email:
              type: string
            mustChangePassword:
              type: boolean

    UcOfflineProduct:
      type: object
      required: [productName, quantity]
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        litresPerUnit: { type: number, minimum: 0 }

    UcOfflineClientInput:
      type: object
      required: [products, saleDate, idempotencyKey]
      properties:
        clientRef: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, description: International phone number }
        email: { type: string, description: Case-insensitive email address }
        products:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/UcOfflineProduct" }
        saleDate: { type: string, format: date }
        notes: { type: string }
        idempotencyKey: { type: string, minLength: 8 }

    UcOfflineClientUpdateInput:
      type: object
      required: [products, saleDate]
      properties:
        clientRef: { type: string }
        phone: { type: string, description: International phone number }
        email: { type: string, description: Case-insensitive email address }
        products:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/UcOfflineProduct" }
        saleDate: { type: string, format: date }
        notes: { type: string }

    UcOfflineClient:
      type: object
      required: [id, clientRef, products, saleDate, accountSetupStatus, deliveryStatus]
      properties:
        id: { type: integer }
        clientRef: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        products:
          type: array
          items: { $ref: "#/components/schemas/UcOfflineProduct" }
        saleDate: { type: string, format: date }
        notes: { type: string }
        companionUserId: { type: [integer, "null"] }
        accountSetupStatus:
          type: string
          enum: [pending, created, linked-existing, conflict, failed]
        deliveryChannel:
          type: [string, "null"]
          enum: [email, whatsapp, null]
        deliveryStatus:
          type: string
          enum: [pending, sending, sent, failed, not_applicable]
        deliveryMetadata: { type: object, additionalProperties: true }
        conflictReason: { type: [string, "null"] }
        deliveryAttempts: { type: integer }
        deliveryLastAttemptAt: { type: [string, "null"], format: date-time }
        deliveryError: { type: [string, "null"] }

    UcOfflineClientResponse:
      type: object
      required: [client]
      properties:
        client: { $ref: "#/components/schemas/UcOfflineClient" }

    UcGuideMedia:
      type: object
      required: [id, kind, url, mimeType, altText]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, animation, video] }
        url: { type: string }
        objectPath: { type: [string, "null"] }
        mimeType: { type: string }
        altText: { type: string }
        caption: { type: [string, "null"] }
        posterUrl: { type: [string, "null"] }
        byteSize: { type: [integer, "null"] }
        durationSeconds: { type: [integer, "null"] }
        animated: { type: boolean }
    UcGuideSection:
      type: object
      required: [id, position, heading, steps, media]
      properties:
        id: { type: string }
        position: { type: integer }
        heading: { type: string }
        body: { type: [string, "null"] }
        steps: { type: array, items: { type: string } }
        tip: { type: [string, "null"] }
        warning: { type: [string, "null"] }
        illustrationIcon: { type: [string, "null"] }
        media: { type: array, items: { $ref: "#/components/schemas/UcGuideMedia" } }
    UcGuideSummary:
      type: object
      required: [slug, title, summary, category, products, icon, readTime, version, updatedAt]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        category: { type: string }
        products: { type: string }
        icon: { type: string }
        readTime: { type: string }
        status: { type: [string, "null"], enum: [draft, published, null] }
        version: { type: integer }
        publishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    UcGuide:
      allOf:
        - $ref: "#/components/schemas/UcGuideSummary"
        - type: object
          required: [id, sections]
          properties:
            id: { type: string }
            sections: { type: array, items: { $ref: "#/components/schemas/UcGuideSection" } }
    UcGuideInput:
      type: object
      required: [slug, title, summary, sections]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{3,120}$" }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        category: { type: string }
        products: { type: string }
        icon: { type: string }
        readTime: { type: string }
        sections: { type: array, items: { $ref: "#/components/schemas/UcGuideSection" } }
