openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: uc-admin
    description: UC companion admin operations
  - name: members
    description: Team member operations
  - name: projects
    description: Project operations
  - name: tasks
    description: Task operations
  - name: dashboard
    description: Cross-project dashboard operations
  - name: anthropic
    description: Anthropic AI chat operations
  - name: ai-monitor
    description: AI project monitoring and Ultra Clear AI integration
  - name: contacts
    description: Unified contact ledger
  - name: system
    description: System status and connectivity watchdog
  - name: notifications
    description: Notification engine and logs
  - name: webhook
    description: External webhook ingestion
  - name: whatsapp
    description: WhatsApp session management and messaging
paths:
  /uc/admin/orders/{id}/customer-stage:
    patch:
      operationId: updateUcOrderCustomerStage
      tags: [uc-admin]
      summary: Advance an order's customer-visible status and send one audited push
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UcOrderCustomerStageInput"
      responses:
        "200": { description: Stage saved (possibly idempotent repeat) }
        "400": { description: Invalid input }
        "403": { description: Admin access required }
        "404": { description: Order not found }
        "409": { description: Invalid forward transition }
  /uc/admin/water-tests/{id}/customer-stage:
    patch:
      operationId: updateUcWaterTestCustomerStage
      tags: [uc-admin]
      summary: Advance a water-test customer stage and send one audited push
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UcWaterTestCustomerStageInput"
      responses:
        "200": { description: Stage saved (possibly idempotent repeat) }
        "400": { description: Invalid input or missing result delivery reference }
        "403": { description: Admin access required }
        "404": { description: Water test not found }
        "409": { description: Invalid forward transition }
  /uc/admin/inventory:
    get:
      operationId: listUcInventory
      tags: [uc-admin]
      summary: List all UC products with live stock from WooCommerce
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryList"
        "401":
          description: Unauthorized

  /uc/admin/inventory/wishlist-demand:
    get:
      operationId: listUcInventoryWishlistDemand
      tags: [uc-admin]
      summary: List product demand from active restock wishlist entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wishlist demand summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryWishlistDemand"
        "401":
          description: Unauthorized

  /uc/admin/inventory/{productId}:
    patch:
      operationId: updateUcInventoryItem
      tags: [uc-admin]
      summary: Update a product's stock quantity in WooCommerce
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryStockUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryUpdateResult"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "502":
          description: WooCommerce unreachable

  /uc/admin/inventory/sync:
    post:
      operationId: triggerUcInventorySync
      tags: [uc-admin]
      summary: Trigger the configured n8n inventory-sync webhook
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncTriggered"
        "401":
          description: Unauthorized
        "422":
          description: n8n webhook URL not configured

  /admin/integrations:
    get:
      operationId: getAdminIntegrations
      tags: [uc-admin]
      summary: Get integration settings metadata (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsSettings"
        "401":
          description: Unauthorized
    patch:
      operationId: updateAdminIntegrations
      tags: [uc-admin]
      summary: Update integration settings (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationsSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /uc/admin/customers:
    get:
      operationId: listUcCustomers
      tags: [uc-admin]
      summary: List UC Companion customers with search and date-range filter (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search by name, email, or normalized international phone number (case-insensitive)
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Registration date range start (inclusive)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Registration date range end (inclusive)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Paginated customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UcCustomerList"
        "401":
          description: Unauthorized
        "403":
          description: Admin access required

  /uc/admin/customers/{customerId}:
    get:
      operationId: getUcCustomer
      tags: [uc-admin]
      summary: Get a single UC customer with their orders and tickets (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UcCustomerDetail"
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Customer not found

  /uc/admin/customers/count:
    get:
      operationId: getUcCustomersCount
      tags: [uc-admin]
      summary: Total registered UC Companion customers (non-deleted)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UcCustomersCount"
        "401":
          description: Unauthorized

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List team members
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a team member
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a team member
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a team member
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: List of projects with progress info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectWithProgress"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /projects/{id}/summary:
    get:
      operationId: getProjectSummary
      tags: [projects]
      summary: Get task breakdown and progress for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "404":
          description: Not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks, optionally filtered
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
        - name: assigneeId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: sourcePlatform
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Cross-project totals and status breakdown
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recently created or updated tasks across all projects
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /ai/query:
    post:
      operationId: aiQuery
      tags: [ai-monitor]
      summary: Inbound webhook — Ultra Clear AI asks a question about projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiQueryInput"
      responses:
        "200":
          description: AI-generated answer with live project context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiQueryAnswer"

  /ai/report:
    get:
      operationId: getAiReport
      tags: [ai-monitor]
      summary: Get the latest generated project report
      responses:
        "200":
          description: Latest AI report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReport"
    post:
      operationId: generateAiReport
      tags: [ai-monitor]
      summary: Generate a fresh AI project status report
      responses:
        "200":
          description: Freshly generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReport"

  /ai/push:
    post:
      operationId: pushToOrchestrator
      tags: [ai-monitor]
      summary: Manually push current project summary to Ultra Clear AI orchestrator
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPushResult"

  /ai/pushes:
    get:
      operationId: listAiPushEvents
      tags: [ai-monitor]
      summary: List recent orchestrator push events (history board, newest first)
      responses:
        "200":
          description: Push event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiPushEvent"

  /ai/echo:
    post:
      operationId: aiPushEcho
      tags: [ai-monitor]
      summary: Inbound status callback (echo) from the orchestrator — HMAC-SHA256 signed via X-Webhook-Signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPushEchoInput"
      responses:
        "200":
          description: Echo accepted, push record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPushEchoAck"
        "401":
          description: Invalid or missing webhook signature
        "404":
          description: Unknown push id

  # ─── Contacts ───────────────────────────────────────────────────
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts in the unified ledger
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a new contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact with their communication methods
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Contact with methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactWithMethods"
        "404":
          description: Not found
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /contacts/{id}/methods:
    get:
      operationId: listContactMethods
      tags: [contacts]
      summary: List communication methods for a contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: List of methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMethod"
    post:
      operationId: addContactMethod
      tags: [contacts]
      summary: Add a communication method to a contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMethodInput"
      responses:
        "201":
          description: Created method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
        "404":
          description: Contact not found

  /contacts/{id}/methods/{methodId}:
    patch:
      operationId: updateContactMethod
      tags: [contacts]
      summary: Update a communication method
      parameters:
        - $ref: "#/components/parameters/ContactId"
        - name: methodId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMethodUpdate"
      responses:
        "200":
          description: Updated method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
        "404":
          description: Not found
    delete:
      operationId: deleteContactMethod
      tags: [contacts]
      summary: Delete a communication method
      parameters:
        - $ref: "#/components/parameters/ContactId"
        - name: methodId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ─── System Status / Watchdog ────────────────────────────────────
  /admin/monitoring:
    get:
      operationId: getMonitoringSnapshot
      tags: [system]
      summary: Live monitoring snapshot — site checks, payment readiness, service status, problem counts
      responses:
        "200":
          description: Current monitoring snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringSnapshot"

  /system/status:
    get:
      operationId: listSystemStatus
      tags: [system]
      summary: List all platform connection statuses
      responses:
        "200":
          description: List of platform statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemStatusRecord"
    post:
      operationId: createSystemStatus
      tags: [system]
      summary: Register a new platform to monitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemStatusInput"
      responses:
        "201":
          description: Created status record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusRecord"

  /system/status/{id}:
    patch:
      operationId: updateSystemStatus
      tags: [system]
      summary: Update a platform connection status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemStatusUpdate"
      responses:
        "200":
          description: Updated status record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusRecord"
        "404":
          description: Not found

  /system/ping/{id}:
    post:
      operationId: pingPlatform
      tags: [system]
      summary: Manually trigger a watchdog ping for a platform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ping result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusRecord"
        "404":
          description: Not found

  # ─── Notifications ───────────────────────────────────────────────
  /notifications/logs:
    get:
      operationId: listNotificationLogs
      tags: [notifications]
      summary: List all dispatched notification logs
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of notification logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationLog"

  /notifications/dispatch:
    post:
      operationId: dispatchNotification
      tags: [notifications]
      summary: Manually dispatch a notification to a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDispatchInput"
      responses:
        "200":
          description: Dispatch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDispatchResult"

  # ─── Team Auth ───────────────────────────────────────────────────
  /auth/change-passcode:
    post:
      operationId: changePasscode
      tags: [whatsapp]
      summary: Change the team passcode
      description: |
        Verifies the current passcode (checking the DB-stored bcrypt hash first,
        then falling back to SESSION_SECRET) and stores a bcrypt hash of the new
        passcode in team_settings.  Requires a valid team-session Bearer token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasscodeInput"
      responses:
        "200":
          description: Passcode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasscodeResult"
        "400":
          description: Missing or too-short passcode
        "401":
          description: Current passcode incorrect or no valid session token

  /auth/token:
    post:
      operationId: issueTeamToken
      tags: [whatsapp]
      summary: Exchange the team passcode for a signed team-session JWT
      description: |
        Validates the passcode against SESSION_SECRET and issues a short-lived
        JWT with type "team-session".  Required before calling any WhatsApp
        management or send routes.  Returns 503 if SESSION_SECRET is not
        configured on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamTokenRequest"
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTokenResponse"
        "400":
          description: Missing passcode
        "401":
          description: Invalid passcode
        "503":
          description: Auth not configured (SESSION_SECRET missing)

  # ─── WhatsApp ────────────────────────────────────────────────────
  /whatsapp/status:
    get:
      operationId: getWhatsAppStatus
      tags: [whatsapp]
      summary: Get current WhatsApp connection state
      responses:
        "200":
          description: Current WhatsApp status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppStatus"

  /whatsapp/connect:
    post:
      operationId: connectWhatsApp
      tags: [whatsapp]
      summary: Initiate WhatsApp pairing flow
      responses:
        "200":
          description: Current WhatsApp status after connect attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppStatus"

  /whatsapp/disconnect:
    post:
      operationId: disconnectWhatsApp
      tags: [whatsapp]
      summary: Log out and wipe the current WhatsApp session
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [ok, state]
                properties:
                  ok: { type: boolean }
                  state: { type: string }

  /whatsapp/send:
    post:
      operationId: sendWhatsAppQuickMessage
      tags: [whatsapp]
      summary: Send a free-form WhatsApp message to a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppSendInput"
      responses:
        "200":
          description: Message queued / sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSendResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "503":
          description: WhatsApp not connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  # ─── Webhook Ingestion ───────────────────────────────────────────
  /webhook/ingest:
    post:
      operationId: ingestWebhook
      tags: [webhook]
      summary: Receive event payloads from Team AI Embedded and other connected platforms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookIngestResult"
        "400":
          description: Validation failed

components:
  parameters:
    MemberId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ContactId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    UcOrderCustomerStageInput:
      type: object
      required: [stage, idempotencyKey]
      properties:
        stage: { type: string, enum: [accepted, shipped, delivered] }
        idempotencyKey: { type: string }

    UcWaterTestCustomerStageInput:
      type: object
      required: [stage, idempotencyKey]
      properties:
        stage: { type: string, enum: [accepted, conducted, result_sent] }
        idempotencyKey: { type: string }
        resultDeliveryReference: { type: string, description: Required for result_sent }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done]

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    ProjectStatus:
      type: string
      enum: [planning, active, on_hold, completed]

    Member:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }

    MemberInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }

    MemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }

    Project:
      type: object
      required: [id, name, description, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        dueDate:
          type: ["string", "null"]
          format: date
        createdAt: { type: string, format: date-time }

    ProjectWithProgress:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [taskCount, doneCount, progressPercent]
          properties:
            taskCount: { type: integer }
            doneCount: { type: integer }
            progressPercent: { type: number }

    ProjectInput:
      type: object
      required: [name, description, status]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        dueDate:
          type: ["string", "null"]
          format: date

    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        dueDate:
          type: ["string", "null"]
          format: date

    ProjectSummary:
      type: object
      required:
        [
          projectId,
          totalTasks,
          progressPercent,
          statusBreakdown,
          priorityBreakdown,
          overdueCount,
        ]
      properties:
        projectId: { type: integer }
        totalTasks: { type: integer }
        progressPercent: { type: number }
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
        priorityBreakdown:
          type: object
          additionalProperties:
            type: integer
        overdueCount: { type: integer }

    Task:
      type: object
      required:
        [
          id,
          projectId,
          title,
          description,
          status,
          priority,
          assigneeId,
          dueDate,
          sourcePlatform,
          deliveryFormat,
          notifyVia,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string }
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        sourcePlatform:
          type: ["string", "null"]
        resourceRequired: {}
        deliveryFormat:
          type: ["string", "null"]
        notifyVia:
          type: ["string", "null"]
        assignmentEmailStatus:
          type: string
          enum: [sent, failed, skipped]
        assignmentEmailError:
          type: ["string", "null"]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskInput:
      type: object
      required: [projectId, title, status, priority]
      properties:
        projectId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        sourcePlatform:
          type: ["string", "null"]
        resourceRequired: {}
        deliveryFormat:
          type: ["string", "null"]
        notifyVia:
          type: ["string", "null"]

    TaskUpdate:
      type: object
      properties:
        projectId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        sourcePlatform:
          type: ["string", "null"]
        resourceRequired: {}
        deliveryFormat:
          type: ["string", "null"]
        notifyVia:
          type: ["string", "null"]

    DashboardSummary:
      type: object
      required:
        [
          totalProjects,
          activeProjects,
          totalTasks,
          overdueTasks,
          statusBreakdown,
          tasksDueThisWeek,
        ]
      properties:
        totalProjects: { type: integer }
        activeProjects: { type: integer }
        totalTasks: { type: integer }
        overdueTasks: { type: integer }
        tasksDueThisWeek: { type: integer }
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer

    ActivityItem:
      type: object
      required:
        [
          taskId,
          taskTitle,
          projectId,
          projectName,
          status,
          assigneeName,
          updatedAt,
        ]
      properties:
        taskId: { type: integer }
        taskTitle: { type: string }
        projectId: { type: integer }
        projectName: { type: string }
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeName:
          type: ["string", "null"]
        updatedAt: { type: string, format: date-time }

    AnthropicConversation:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, title, createdAt]
    AnthropicMessage:
      type: object
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        role: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, conversationId, role, content, createdAt]
    AnthropicConversationInput:
      type: object
      properties:
        title: { type: string }
      required: [title]
    AnthropicMessageInput:
      type: object
      properties:
        content: { type: string }
      required: [content]
    AnthropicConversationWithMessages:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required: [id, title, createdAt, messages]
    AnthropicError:
      type: object
      properties:
        error: { type: string }
      required: [error]

    AiQueryInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1 }
        source:
          type: string
          description: Identifier of the calling agent (e.g. "orchestrator", "analytics-agent")

    AiQueryAnswer:
      type: object
      required: [answer, generatedAt]
      properties:
        answer: { type: string }
        generatedAt: { type: string, format: date-time }
        source: { type: string }

    AiReport:
      type: object
      required: [summary, highlights, risks, generatedAt]
      properties:
        summary: { type: string }
        highlights:
          type: array
          items: { type: string }
        risks:
          type: array
          items: { type: string }
        generatedAt: { type: string, format: date-time }

    AiPushResult:
      type: object
      required: [success, message, sentAt]
      properties:
        success: { type: boolean }
        message: { type: string }
        sentAt: { type: string, format: date-time }
        webhookUrl: { type: string }
        pushId: { type: string }

    AiPushEvent:
      type: object
      required: [id, payloadType, trigger, target, sentAt, outboundOk, outboundMessage, status, statusDetail, statusUpdatedAt]
      properties:
        id: { type: string }
        payloadType: { type: string }
        trigger: { type: string }
        target: { type: string }
        sentAt: { type: string, format: date-time }
        outboundOk: { type: boolean }
        outboundMessage: { type: string }
        status: { type: string }
        statusDetail: { type: string }
        statusUpdatedAt: { type: string, format: date-time }
        lastEchoAt: { type: string, format: date-time }
        targetAgent: { type: string }
        taskTitle: { type: string }

    AiPushEchoInput:
      type: object
      required: [pushId, status]
      properties:
        pushId: { type: string, minLength: 1 }
        status:
          type: string
          enum: [received, processing, completed, failed]
        message: { type: string }

    AiPushEchoAck:
      type: object
      required: [ok, pushId, status]
      properties:
        ok: { type: boolean }
        pushId: { type: string }
        status: { type: string }

    # ─── Contact Schemas ─────────────────────────────────────────
    Contact:
      type: object
      required: [id, fullName, role, organization, tags, createdAt]
      properties:
        id: { type: integer }
        fullName: { type: string }
        role: { type: string }
        organization: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    ContactInput:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1 }
        role: { type: string }
        organization: { type: string }
        tags:
          type: array
          items: { type: string }

    ContactUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        role: { type: string }
        organization: { type: string }
        tags:
          type: array
          items: { type: string }

    ContactMethod:
      type: object
      required: [id, contactId, channelType, channelValue, isPreferred, createdAt]
      properties:
        id: { type: integer }
        contactId: { type: integer }
        channelType: { type: string }
        channelValue: { type: string }
        isPreferred: { type: boolean }
        createdAt: { type: string, format: date-time }

    ContactMethodInput:
      type: object
      required: [channelType, channelValue]
      properties:
        channelType: { type: string, minLength: 1 }
        channelValue: { type: string, minLength: 1 }
        isPreferred: { type: boolean }

    ContactMethodUpdate:
      type: object
      properties:
        channelType: { type: string, minLength: 1 }
        channelValue: { type: string, minLength: 1 }
        isPreferred: { type: boolean }

    ContactWithMethods:
      allOf:
        - $ref: "#/components/schemas/Contact"
        - type: object
          required: [methods]
          properties:
            methods:
              type: array
              items:
                $ref: "#/components/schemas/ContactMethod"

    # ─── System Status Schemas ────────────────────────────────────
    SystemStatusRecord:
      type: object
      required: [id, platform, status, lastChecked, createdAt]
      properties:
        id: { type: integer }
        platform: { type: string }
        status: { type: string }
        lastChecked: { type: string, format: date-time }
        lastSync:
          type: ["string", "null"]
          format: date-time
        notes: { type: string }
        createdAt: { type: string, format: date-time }

    SystemStatusInput:
      type: object
      required: [platform]
      properties:
        platform: { type: string, minLength: 1 }
        status: { type: string }
        notes: { type: string }

    SystemStatusUpdate:
      type: object
      properties:
        status: { type: string }
        notes: { type: string }

    # ─── Monitoring Schemas ───────────────────────────────────────
    MonitoringHistoryPoint:
      type: object
      required: [at, ok]
      properties:
        at: { type: string }
        ok: { type: boolean }
        responseMs: { type: ["integer", "null"] }

    MonitoringSiteCheck:
      type: object
      required: [key, label, url, ok, checkedAt, history]
      properties:
        key: { type: string }
        label: { type: string }
        url: { type: string }
        ok: { type: boolean }
        httpStatus: { type: ["integer", "null"] }
        responseMs: { type: ["integer", "null"] }
        checkedAt: { type: string }
        error: { type: ["string", "null"] }
        history:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringHistoryPoint"

    MonitoringService:
      type: object
      required: [name, status, detail]
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, warn, down] }
        detail: { type: string }

    MonitoringSnapshot:
      type: object
      required: [generatedAt, site, payments, services, problems]
      properties:
        generatedAt: { type: string }
        site:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringSiteCheck"
        payments:
          type: object
          required: [paystack, mpesaMode, stripe, cod]
          properties:
            paystack: { type: boolean }
            mpesaMode: { type: string, enum: [live, demo] }
            stripe: { type: boolean }
            cod: { type: boolean }
        services:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringService"
        problems:
          type: object
          required: [recoveryOrders, notificationFailures7d]
          properties:
            recoveryOrders: { type: integer }
            notificationFailures7d: { type: integer }

    # ─── Notification Schemas ─────────────────────────────────────
    NotificationLog:
      type: object
      required: [id, channelType, channelValue, templateId, status, sentAt]
      properties:
        id: { type: integer }
        taskId:
          type: ["integer", "null"]
        contactId:
          type: ["integer", "null"]
        channelType: { type: string }
        channelValue: { type: string }
        templateId: { type: string }
        subject: { type: string }
        body: { type: string }
        status: { type: string }
        errorMessage:
          type: ["string", "null"]
        sentAt: { type: string, format: date-time }
        whatsappMessageId:
          type: ["string", "null"]
          description: Baileys message key ID used to match delivery/read receipts
        deliveryStatus:
          type: ["string", "null"]
          description: "WhatsApp receipt status: delivered | read (null = not yet acknowledged)"

    NotificationDispatchInput:
      type: object
      required: [contactId, templateId]
      properties:
        contactId: { type: integer }
        templateId: { type: string }
        taskId:
          type: ["integer", "null"]
        overrideChannel:
          type: ["string", "null"]

    NotificationDispatchResult:
      type: object
      required: [success, channelUsed, logId]
      properties:
        success: { type: boolean }
        channelUsed: { type: string }
        logId: { type: integer }
        fallbackUsed: { type: boolean }
        message: { type: string }

    # ─── Webhook Schemas ──────────────────────────────────────────
    WebhookPayload:
      type: object
      required: [event, sourcePlatform]
      properties:
        event: { type: string }
        sourcePlatform: { type: string }
        taskData:
          type: object
          properties:
            title: { type: string }
            description: { type: string }
            assigneeId:
              type: ["integer", "null"]
            projectId: { type: integer }
            status: { type: string }
            priority: { type: string }
            dueDate:
              type: ["string", "null"]
            resourceRequired: {}
            deliveryFormat: { type: string }
            notifyVia: { type: string }
        meta: {}

    WebhookIngestResult:
      type: object
      required: [accepted, taskId, message]
      properties:
        accepted: { type: boolean }
        taskId:
          type: ["integer", "null"]
        message: { type: string }
        validationErrors:
          type: array
          items: { type: string }

    # ─── Team Auth Schemas ────────────────────────────────────────
    ChangePasscodeInput:
      type: object
      required: [currentPasscode, newPasscode]
      properties:
        currentPasscode:
          type: string
          minLength: 1
          description: The current team passcode (used to verify identity)
        newPasscode:
          type: string
          minLength: 8
          description: The new passcode (minimum 8 characters)

    ChangePasscodeResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    TeamTokenRequest:
      type: object
      required: [passcode]
      properties:
        passcode:
          type: string
          minLength: 1
          description: The team passcode (SESSION_SECRET value)

    TeamTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Signed team-session JWT (Bearer token)

    # ─── WhatsApp Schemas ─────────────────────────────────────────
    WhatsAppStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [disconnected, connecting, qr, connected]
        qr:
          type: ["string", "null"]

    WhatsAppSendInput:
      type: object
      required: [to, message]
      properties:
        to:
          type: string
          minLength: 1
          description: Recipient phone number (e.g. +254712345678)
        message:
          type: string
          minLength: 1
          description: Plain-text message body

    WhatsAppSendResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        to: { type: string }

    # ─── UC Admin Schemas ─────────────────────────────────────────
    InventoryProduct:
      type: object
      required: [id, name, sku, stockQuantity, stockStatus, syncedAt]
      properties:
        id:            { type: integer }
        name:          { type: string }
        sku:           { type: string }
        stockQuantity: { type: integer }
        stockStatus:   { type: string }
        permalink:     { type: ["string", "null"] }
        syncedAt:      { type: string, format: date-time }

    InventoryList:
      type: object
      required: [products, source]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/InventoryProduct"
        source:
          type: string
          enum: [woocommerce, mock]

    InventoryStockUpdate:
      type: object
      required: [stockQuantity]
      properties:
        stockQuantity:
          type: integer
          minimum: 0

    InventoryUpdateResult:
      type: object
      required: [ok, productId, stockQuantity, source]
      properties:
        ok:            { type: boolean }
        productId:     { type: integer }
        stockQuantity: { type: integer }
        source:        { type: string }

    InventoryWishlistDemand:
      type: object
      required:
        - productId
        - productName
        - waitingCustomerCount
        - pendingCustomerCount
        - notifiedCustomerCount
        - lastAddedAt
        - lastNotifiedRestockAt
        - restockDemandAlertedAt
      properties:
        productId:                 { type: integer }
        productName:               { type: string }
        waitingCustomerCount:      { type: integer }
        pendingCustomerCount:      { type: integer }
        notifiedCustomerCount:     { type: integer }
        lastAddedAt:               { type: ["string", "null"], format: date-time }
        lastNotifiedRestockAt:     { type: ["string", "null"], format: date-time }
        restockDemandAlertedAt:    { type: ["string", "null"], format: date-time }

    SyncTriggered:
      type: object
      required: [ok, triggeredAt]
      properties:
        ok:          { type: boolean }
        triggeredAt: { type: string, format: date-time }

    IntegrationsSettings:
      type: object
      required: [n8nInventoryWebhook]
      properties:
        n8nInventoryWebhook:
          type: object
          required: [isSet]
          properties:
            isSet:     { type: boolean }
            hostname:  { type: ["string", "null"] }
            updatedAt: { type: ["string", "null"] }

    IntegrationsSettingsInput:
      type: object
      properties:
        n8nInventoryWebhookUrl: { type: string }

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    UcCustomerSummary:
      type: object
      required: [id, email, firstName, lastName, name, phone, joinedAt, orderCount, products]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        name:
          type: string
        phone:
          type: string
        joinedAt:
          type: string
          format: date-time
        orderCount:
          type: integer
        products:
          type: array
          items:
            type: string

    UcCustomerList:
      type: object
      required: [customers, total, page, limit]
      properties:
        customers:
          type: array
          items:
            $ref: "#/components/schemas/UcCustomerSummary"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    UcCustomerOrderItem:
      type: object
      required: [name, quantity, total]
      properties:
        name:
          type: string
        quantity:
          type: integer
        total:
          type: string

    UcCustomerOrder:
      type: object
      required: [id, status, total, currency, paymentMethod, dateCreated, lineItems]
      properties:
        id:
          type: integer
        status:
          type: string
        total:
          type: string
        currency:
          type: string
        paymentMethod:
          type: string
        dateCreated:
          type: string
          format: date-time
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/UcCustomerOrderItem"

    UcCustomerTicket:
      type: object
      required: [id, productModel, issueDescription, status, createdAt]
      properties:
        id:
          type: string
        productModel:
          type: string
        issueDescription:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    UcCustomerDetail:
      type: object
      required: [customer, orders, tickets]
      properties:
        customer:
          type: object
          required: [id, email, firstName, lastName, name, phone, joinedAt, authProvider]
          properties:
            id:
              type: integer
            email:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            name:
              type: string
            phone:
              type: string
            joinedAt:
              type: string
              format: date-time
            authProvider:
              type: string
        orders:
          type: array
          items:
            $ref: "#/components/schemas/UcCustomerOrder"
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/UcCustomerTicket"

    UcCustomersCount:
      type: object
      required: [count, newThisWeek, newThisMonth]
      properties:
        count:
          type: integer
          description: Total registered (non-deleted) UC Companion customers
        newThisWeek:
          type: integer
          description: Customers who registered since the start of the current calendar week
        newThisMonth:
          type: integer
          description: Customers who registered since the start of the current calendar month
