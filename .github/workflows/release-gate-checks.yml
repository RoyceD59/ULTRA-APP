name: Frozen release gate checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Provenance checks compare archived bytes to exact retained commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify reviewed source, active build guards and immutable rollback behaviour
        run: |
          node --test \
            infra/cloudflare/forest/auth-upload-security.test.mjs \
            infra/cloudflare/forest/consistency-handoff.test.mjs \
            infra/cloudflare/forest/product-page-selection.test.mjs \
            infra/cloudflare/forest/release-package.test.mjs \
            infra/cloudflare/forest/site.test.mjs \
            infra/cloudflare/forest/router.test.mjs 2>&1 | tee release-gates.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frozen-release-gate-evidence
          path: release-gates.log
          if-no-files-found: error
          retention-days: 14
