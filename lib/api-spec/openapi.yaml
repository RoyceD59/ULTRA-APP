    post:
      operationId: validateUcReferralOrPromotionCode
      tags: [uc-referrals]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "200":
          description: Explicit code validity and type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UcCodeValidation" }
        "401": { description: Authentication required }
  /uc/referrals/my-code:
    get:
      operationId: getUcReferralCode
      tags: [uc-referrals]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Authenticated account referral snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UcReferralSnapshot" }
        "401": { description: Authentication required }

  /oauth/token:
    post:
      operationId: issueAgentClientToken
      tags: [agent-oauth]
      summary: Issue a short-lived private machine-agent token
      description: Send client_id and client_secret using HTTP Basic authentication. Client secret post authentication is not accepted.
      security: [{ clientBasic: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                scope: { type: string }
      responses:
        "200": { description: Token issued, content: { application/json: { schema: { $ref: "#/components/schemas/AgentToken" } } } }
        "401": { description: Invalid client }
        "429": { description: Rate limited }
  /uc/ai/water-chat:
    post:
      operationId: createUcAlisonTurn
      tags: [anthropic]
      summary: Generate and persist one anonymous Alison turn
      description: The customer bearer token authenticates use of Alison, but no customer identity or filter context is stored with the transcript. Reusing the same conversationId and turnId returns the already-persisted answer. New replies use relevant curated Markdown and published guide/article snapshots, with concise default answers.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlisonTurnInput" }
      responses:
        "200":
          description: Generated or idempotently replayed Alison answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlisonTurnResponse" }
        "400": { description: Invalid messages or anonymous identifiers }
        "401": { description: Customer authentication required }
        "429": { description: Customer rate limit exceeded }
        "502": { description: Alison generation or transcript persistence unavailable }
        "503": { description: Approved Alison reference documents temporarily unavailable }
  /oauth/clients:
    get:
      operationId: listAgentOauthClients
      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Registered private clients, content: { application/json: { schema: { $ref: "#/components/schemas/AgentClientList" } } } }
        "403": { description: Active ProjectHub administrator required }
    post:
      operationId: createAgentOauthClient
      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentClientInput"
      responses:
        "201": { description: Client and one-time secret }
        "400": { description: Invalid scope list }
        "403": { description: Active ProjectHub administrator required }
