            application/json:
              schema: { $ref: "#/components/schemas/RefillCapabilities" }

components:
  parameters:
    MemberId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ContactId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    clientBasic:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    LibraryKnowledgePreview:
      type: object
      required: [text, hash, revision, status, title, approvedText]
      properties:
        text: { type: string, maxLength: 16000 }
        hash: { type: string }
        revision: { type: integer, minimum: 0 }
        status: { type: string, enum: [private, approved, revoked] }
        title: { type: string }
        approvedText: { type: [string, "null"] }
    LibraryKnowledgeDecision:
      type: object
      required: [action, revision]
      properties:
        action: { type: string, enum: [approve, revoke] }
        revision: { type: integer, minimum: 0 }
        hash: { type: string, description: Preview hash required on approval }
        title: { type: string, maxLength: 160, description: Public source title required on approval }
        publicReferenceConfirmed:
          type: boolean
          description: Must be true to approve; confirms no private or customer information
    LibraryKnowledgeMetadata:
      type: object
      required: [id, knowledgeStatus, knowledgeRevision, knowledgeTitle, knowledgeReviewedAt, knowledgeReviewedBy]
      properties:
        id: { type: string }
        knowledgeStatus: { type: string, enum: [private, approved, revoked] }
        knowledgeRevision: { type: integer }
        knowledgeTitle: { type: [string, "null"] }
        knowledgeReviewedAt: { type: [string, "null"], format: date-time }
        knowledgeReviewedBy: { type: [string, "null"] }
    PhysicalTestPromotionInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 3, maxLength: 64 }
    CompanionCheckoutQuoteInput:
      type: object
      required: [lineItems, fulfillment]
      properties:
        fulfillment: { type: string, enum: [collection, delivery] }
        code: { type: string, maxLength: 64 }
        applyReferralDiscount: { type: boolean }
        lineItems:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1, maximum: 1000 }
    CompanionCheckoutQuote:
      type: object
      required: [promotion, fulfillment, subtotal, delivery, discountAmount, total]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [productId, name, quantity, subtotal]
            properties:
              productId: { type: integer }
              name: { type: string }
              quantity: { type: integer }
              subtotal: { type: number }
        promotion:
          type: object
          required: [code]
          properties:
            code: { type: string }
            title: { type: string }
            label: { type: string }
            type: { type: string }
        fulfillment: { type: string, enum: [collection, delivery] }
        subtotal: { type: number }
        delivery: { type: number }
        discountAmount: { type: number }
        total: { type: number }
    CustomerAssignmentInput:
      type: object
      required: [idempotencyKey, customerName, email, phone, productId, installationDate, orderId, orderItemId]
      properties:
        idempotencyKey: { type: string }
        customerName: { type: string }
        email: { type: string }
        phone: { type: string }
        productId: { type: integer }
        installationDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        orderId: { type: integer }
        orderItemId: { type: integer }
        targetAccountId: { type: integer }
    AssignmentOrderLine:
      type: object
      required: [orderId, orderItemId, productId, name, quantity, ownerReference, status]
      properties:
        orderId: { type: integer }
        orderItemId: { type: integer }
        productId: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        ownerReference: { type: string }
        status: { type: string }
        wooOrderId: { type: [integer, 'null'] }
        cashCollectionState: { type: [string, 'null'] }
        assignmentId: { type: [integer, 'null'] }
    CustomerFilterAssignment:
      type: object
      required: [id, customerName, email, phone, productId, productName, lifespanDays, capacityLitres, installationDate, orderId, orderItemId, orderReference, cashCollectionState, status]
      properties:
        id: { type: integer }
        customerName: { type: string }
        email: { type: string }
        phone: { type: string }
        productId: { type: integer }
        productName: { type: string }
        lifespanDays: { type: integer }
        capacityLitres: { type: integer }
        installationDate: { type: string }
        orderId: { type: integer }
        orderItemId: { type: integer }
        orderReference: { type: string }
        cashCollectionState: { type: string }
        status: { type: string, enum: [pending, linked, review] }
        reviewReason: { type: [string, 'null'] }
        targetAccountId: { type: [integer, 'null'] }
        linkedAccountId: { type: [integer, 'null'] }
        filterId: { type: [integer, 'null'] }
        activatedAt: { type: [string, 'null'] }
        maintenanceCount: { type: [integer, 'null'] }
        active: { type: [boolean, 'null'] }
        createdAt: { type: string }
        linkedAt: { type: [string, 'null'] }
        audit:
          type: array
          items:
            type: object
            properties:
              actor: { type: string }
              action: { type: string }
              createdAt: { type: string }
              details: { type: object, additionalProperties: true }
    UcDailyHydrationInput:
      type: object
      additionalProperties: false
      required: [litres]
      properties:
        litres: { type: number, minimum: 0 }
    UcDailyHydration:
      type: object
      required: [localDate, litres]
      properties:
        localDate: { type: string }
        litres: { type: [number, "null"] }
    HydrateAllocationConfig:
      type: object
      required: [contributionRate, treeShare, treeCostKes]
      properties:
        contributionRate: { type: number, const: 0.03 }
        treeShare: { type: number, const: 0.5 }
        treeCostKes: { type: number, exclusiveMinimum: 0 }
    HydrateCustomerTree:
      type: object
      required: [eligibleOrders, eligiblePurchasesKes, allocationKes, treeShareKes, cleanWaterKes, replacementPurchases, treesHelped, tree, config]
      properties:
        eligibleOrders: { type: integer, minimum: 0 }
        eligiblePurchasesKes: { type: number, minimum: 0 }
        allocationKes: { type: number, minimum: 0 }
        treeShareKes: { type: number, minimum: 0 }
        cleanWaterKes: { type: number, minimum: 0 }
        replacementPurchases: { type: integer, minimum: 0 }
        treesHelped: { type: integer, minimum: 0 }
        config: { $ref: "#/components/schemas/HydrateAllocationConfig" }
        tree:
          type: [object, "null"]
          required: [stage, fundedPct, established, yourShareKes]
          properties:
            stage: { type: string, enum: [seed, sapling, growing, funded] }
            fundedPct: { type: integer, minimum: 0, maximum: 100 }
            established: { type: boolean }
            yourShareKes: { type: number, minimum: 0 }
    HydrateForestTotals:
      type: object
      required: [generatedAt, eligibleRevenueKes, appRevenueKes, baselineRevenueKes, contributionKes, treeFundKes, cleanWaterKes, sharedTreesFunded, growingTreePct, estimatedTreesFunded, treesPlanted, treesEstablished, reportDate, location, config]
      properties:
        generatedAt: { type: string }
