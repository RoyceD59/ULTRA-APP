openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: uc-admin
    description: UC companion admin operations
  - name: members
    description: Team member operations
  - name: projects
    description: Project operations
  - name: tasks
    description: Task operations
  - name: dashboard
    description: Cross-project dashboard operations
  - name: anthropic
    description: Anthropic AI chat operations
  - name: ai-monitor
    description: AI project monitoring and Ultra Clear AI integration
  - name: contacts
    description: Unified contact ledger
  - name: system
    description: System status and connectivity watchdog
  - name: notifications
    description: Notification engine and logs
  - name: webhook
    description: External webhook ingestion
  - name: whatsapp
    description: WhatsApp session management and messaging
  - name: instant-water-check
    description: Instant water assessment and physical-test lead flow
  - name: agent-oauth
    description: Private ProjectHub administrator-managed machine-agent access
  - name: customer-lifecycle
    description: Canonical customer identity, filter lifecycle, impact, and mission control contracts
  - name: companion-blog
    description: Public Companion articles and human-reviewed editorial workflow
paths:
  /library/docs/{id}/knowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: previewLibraryKnowledge
      summary: Review bounded extracted text for customer knowledge (active team admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Inert text preview; never returns a private object URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryKnowledgePreview"
        "401": { description: Team authentication required }
        "403": { description: Active administrator required }
        "404": { description: Document not found }
        "422": { description: "Unsupported, oversized, binary, or invalid UTF-8 document" }
        "503": { description: Review temporarily unavailable }
    post:
      operationId: decideLibraryKnowledge
      summary: Approve the reviewed text snapshot or revoke it (active team admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryKnowledgeDecision"
      responses:
        "200":
          description: Persisted approval or revocation metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryKnowledgeMetadata"
        "400": { description: Invalid decision or missing public-reference confirmation }
        "401": { description: Team authentication required }
        "403": { description: Active administrator required }
        "404": { description: Document not found }
        "409": { description: Review revision or content hash changed }
        "422": { description: Unsupported or invalid reference text }
        "503": { description: Approval temporarily unavailable }
  /uc/checkout/cancel:
    post:
      operationId: cancelCompanionCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: Uninitiated or provider-confirmed failed checkout cancelled; benefits released
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { type: boolean }
        "409":
          description: Payment may still complete; resume the original payment
  /uc/checkout/quote:
    post:
      operationId: quoteCompanionCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanionCheckoutQuoteInput" }
      responses:
        "200":
          description: Server-priced cart, shipping and code benefit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionCheckoutQuote" }
        "422":
          description: Products, fulfillment or benefit cannot be verified
  /uc/customer/promotions/water_test/quote:
    post:
      operationId: quotePhysicalTestPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhysicalTestPromotionInput" }
      responses:
        "200":
          description: Eligible free physical test entitlement; not a payment or refund
          content:
            application/json:
              schema:
                type: object
                required: [promotion]
                properties:
                  promotion:
                    type: object
                    required: [code]
                    properties:
                      code: { type: string }
        "422":
          description: Code inactive, expired, exhausted or ineligible
  /admin/customer-assignments:
    get:
      operationId: listCustomerAssignments
      tags: [uc-admin]
      responses:
        '200':
          description: Durable assignments separate from recovery logs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerFilterAssignment' }
    post:
      operationId: createCustomerAssignment
      tags: [uc-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAssignmentInput' }
      responses:
        '200':
          description: Reservation saved; linking requires separate confirmation
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer }
  /admin/customer-assignments/preview:
    post:
      operationId: previewCustomerAssignment
      tags: [uc-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAssignmentInput' }
      responses:
        '200':
          description: Server-checked contact, catalogue and ownership preview
          content:
            application/json:
              schema:
                type: object
                required: [productName, lifespanDays, capacityLitres, cashCollectionState]
                properties:
                  productName: { type: string }
                  lifespanDays: { type: integer }
                  capacityLitres: { type: integer }
                  cashCollectionState: { type: string }
  /admin/customer-assignments/order-lines:
    get:
      operationId: findAssignmentOrderLines
      tags: [uc-admin]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Existing durable COD order lines; source rechecked at preview and link
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssignmentOrderLine' }
  /admin/customer-assignments/{id}/link:
    post:
      operationId: confirmCustomerAssignmentLink
      tags: [uc-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, confirm]
              properties:
                accountId: { type: integer }
                confirm: { type: boolean }
      responses:
        '200':
          description: Result, including review reasons when linking is blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerFilterAssignment' }
  /admin/customer-assignments/{id}/retry:
    post:
      operationId: retryCustomerAssignment
      tags: [uc-admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Retry using verified contacts, never staff authorization by implication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerFilterAssignment' }
  /uc/customer/assignments:
    get:
      operationId: getMyCustomerAssignments
      tags: [customer-lifecycle]
      responses:
        '200':
          description: Authenticated account-owned linked filters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerFilterAssignment' }
  /uc/me/hydration/{localDate}:
    get:
      operationId: getUcDailyHydration
      parameters:
        - { name: localDate, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Daily filtered-water total; null means not recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UcDailyHydration" }
    put:
      operationId: saveUcDailyHydration
      parameters:
        - { name: localDate, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UcDailyHydrationInput" }
      responses:
        "200":
          description: Saved daily total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UcDailyHydration" }
  /uc/customer/tree:
    get:
      operationId: getHydrateCustomerTree
      tags: [customer-lifecycle]
      summary: Own shared-tree allocation and aggregate progress
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer's allocation only; no co-funder identities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HydrateCustomerTree" }
        "401": { description: Active customer session required }
        "503": { description: Allocation or read temporarily unavailable }
  /uc/impact/forest:
    get:
      operationId: getHydrateForestTotals
      tags: [customer-lifecycle]
      summary: Credential-free aggregate programme allocations, not verified field outcomes
      security: []
      responses:
        "200":
          description: Public aggregate totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HydrateForestTotals" }
        "503": { description: Totals temporarily unavailable; do not assume zero }
  /admin/customer-reviews:
    get:
      operationId: listCustomerReviews
      tags: [uc-admin]
      summary: Administrator-only Companion review log with matching-dataset counts
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {in: query, name: productId, schema: {type: integer, minimum: 1, maximum: 2147483647}}
        - {in: query, name: rating, schema: {type: integer, minimum: 1, maximum: 5}}
        - {in: query, name: ratingSentiment, schema: {type: string, enum: [Positive, Neutral, Negative]}}
        - {in: query, name: aiSentiment, schema: {type: string, enum: [Positive, Neutral, Negative, Mixed]}}
        - {in: query, name: status, schema: {type: string, enum: [pending, processing, completed, failed, unavailable]}}
        - {in: query, name: disagreement, schema: {type: boolean}}
        - {in: query, name: search, schema: {type: string, maxLength: 200}}
      responses:
        "200":
          description: Paginated rows and summaries across all matching reviews
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerReviewLog"}
        "400": {description: Invalid filter or pagination}
        "401": {description: Authentication required}
        "403": {description: Administrator access required}
        "503": {description: Review log temporarily unavailable}
  /admin/customer-reviews/{id}/retry:
    post:
      operationId: retryCustomerReviewAnalysis
      tags: [uc-admin]
      summary: Queue a failed eligible review for automated text analysis
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1, maximum: 2147483647}}
      responses:
        "200":
          description: Retry queued without waiting for AI
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        "401": {description: Authentication required}
        "403": {description: Administrator access required}
        "409": {description: Current review is not eligible for retry}
        "503": {description: Retry temporarily unavailable}
  /water-check/assessments:
    post:
      operationId: createPublicInstantWaterAssessment
      tags: [instant-water-check]
      summary: Create a public instant water assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicInstantWaterAssessmentInput"
      responses:
        "201":
          description: Assessment and redacted result token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterAssessmentCreated"
        "400": { description: Invalid controlled answer or consent }
        "409": { description: Idempotency key was reused with another payload }
        "429": { description: Rate limit exceeded }

  /uc/water-check/assessments:
    post:
      operationId: createAuthenticatedInstantWaterAssessment
      tags: [instant-water-check]
      summary: Create an instant water assessment for the authenticated customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatedInstantWaterAssessmentInput"
      responses:
        "201":
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedInstantWaterAssessmentCreated"
        "400": { description: Invalid controlled answer }
        "401": { description: Authentication required }
        "409": { description: Idempotency key was reused with another payload }

  /water-check/results/{token}:
    get:
      operationId: getPublicInstantWaterAssessmentResult
      tags: [instant-water-check]
      summary: Fetch a redacted instant water result by its public token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        "200":
          description: Redacted result (contains no contact or ownership data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInstantWaterAssessmentResult"
        "404":
          description: "Result token is unknown, expired, or revoked"
        "429": { description: Rate limit exceeded }

  /water-check/assessments/{assessmentId}/verification/request:
    post:
      operationId: requestInstantWaterAssessmentVerification
      tags: [instant-water-check]
      summary: Request a phone verification code for one assessment
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterVerificationRequestInput"
      responses:
        "202":
          description: Verification request accepted without account-existence disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterVerificationRequested"
        "400": { description: Invalid channel or explicit SMS consent missing }
        "404": { description: Assessment not found }
        "429": { description: Rate limit exceeded }
        "409": { description: Delivery is already in progress for this idempotent request }
        "503": { description: Verification provider delivery failed; retry the same idempotency key }

  /water-check/assessments/{assessmentId}/verification/confirm:
    post:
      operationId: confirmInstantWaterAssessmentVerification
      tags: [instant-water-check]
      summary: Confirm the short-lived phone verification code
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterVerificationConfirmInput"
      responses:
        "200":
          description: Verification accepted and scoped action token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterVerificationConfirmed"
        "400": { description: Invalid or expired code }
        "404": { description: Assessment not found }
        "429": { description: Too many attempts }

  /water-check/handoff/consume:
    post:
      operationId: consumeInstantWaterAssessmentHandoff
      tags: [instant-water-check]
      summary: Securely attach a verified unmatched assessment to the signed-in customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterAssessmentHandoffConsumeInput"
      responses:
        "200":
          description: Assessment attached to the authenticated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterAssessment"
        "400": { description: Invalid handoff token input }
        "401": { description: Authentication required }
        "403": { description: "Invalid, expired, revoked, consumed, mismatched, or already attached handoff" }

  /uc/water-check/assessments/{assessmentId}/attach:
    post:
      operationId: attachInstantWaterAssessment
      tags: [instant-water-check]
      summary: Attach one verified public assessment to the signed-in customer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterAssessmentAttachInput"
      responses:
        "200":
          description: Assessment attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterAssessment"
        "401": { description: Authentication required }
        "403": { description: Verification or ownership proof required }
        "404": { description: Assessment not found }
        "409": { description: Assessment has an ambiguous or newer account state }

  /uc/water-check/assessments/{assessmentId}/physical-test:
    post:
      operationId: requestInstantWaterPhysicalTest
      tags: [instant-water-check]
      summary: Request the physical-test stage on the existing assessment ticket
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterPhysicalTestRequestInput"
      responses:
        "200":
          description: Existing assessment and ticket transitioned atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterPhysicalTestResponse"
        "400": { description: Invalid service details or media reference }
        "401": { description: Authentication or assessment action token required }
        "404": { description: Assessment not found }
        "409": { description: Stale transition or market unavailable }

  /uc/me/water-check/assessments:
    get:
      operationId: listAuthenticatedInstantWaterAssessments
      tags: [instant-water-check]
      summary: List assessments owned by the authenticated customer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer-owned assessment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterAssessmentHistory"
        "401": { description: Authentication required }

  /uc/me/water-check/latest:
    get:
      operationId: getAuthenticatedLatestInstantWaterAssessment
      tags: [instant-water-check]
      summary: Get the latest owned assessment summary for Companion chat context
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Latest customer-owned assessment summary, if present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterLatestSummary"
        "401": { description: Authentication required }

  /uc/admin/water-checks:
    get:
      operationId: listProjectHubInstantWaterAssessments
      tags: [instant-water-check]
      summary: List instant water assessments for ProjectHub
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: customerId
          in: query
          description: Filter to assessments attached to this customer account.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Water-check queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHubInstantWaterList"
        "401": { description: Authentication required }
        "403": { description: water_tests permission required }

  /uc/admin/water-checks/{assessmentId}:
    get:
      operationId: getProjectHubInstantWaterAssessment
      tags: [instant-water-check]
      summary: View one instant water assessment and its ticket in ProjectHub
      security: [{ bearerAuth: [] }]
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHubInstantWaterDetail"
        "403": { description: water_tests permission required }
        "404": { description: Assessment not found }
    patch:
      operationId: updateProjectHubInstantWaterAssessment
      tags: [instant-water-check]
      summary: Update an authorized operational water-test state
      security: [{ bearerAuth: [] }]
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectHubInstantWaterUpdateInput"
      responses:
        "200":
          description: Assessment state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHubInstantWaterDetail"
        "403": { description: Permission or administrator access required }
        "404": { description: Assessment not found }
        "409": { description: Stale transition }

  /uc/admin/orders/{id}/customer-stage:
    patch:
      operationId: updateUcOrderCustomerStage
      tags: [uc-admin]
      summary: Advance an order's customer-visible status and send one audited push
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UcOrderCustomerStageInput"
      responses:
        "200": { description: Stage saved (possibly idempotent repeat) }
        "400": { description: Invalid input }
        "403": { description: Admin access required }
        "404": { description: Order not found }
        "409": { description: Invalid forward transition }
  /uc/admin/water-tests/{id}/customer-stage:
    patch:
      operationId: updateUcWaterTestCustomerStage
      tags: [uc-admin]
      summary: Advance a water-test customer stage and send one audited push
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UcWaterTestCustomerStageInput"
      responses:
        "200": { description: Stage saved (possibly idempotent repeat) }
        "400": { description: Invalid input or missing result delivery reference }
        "403": { description: Admin access required }
        "404": { description: Water test not found }
        "409": { description: Invalid forward transition }
  /uc/admin/inventory:
    get:
      operationId: listUcInventory
      tags: [uc-admin]
      summary: List all UC products with live stock from WooCommerce
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryList"
        "401":
          description: Unauthorized

  /uc/products:
    get:
      operationId: listUcProducts
      tags: [uc-admin]
      summary: List customer-facing products
      description: Public catalogue list; optional category and name/SKU search filters.
      parameters:
        - name: publicationSafe
          in: query
          description: Require configured WooCommerce published inventory; never substitute demo products.
          schema: { type: boolean, default: false }
        - name: category
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Customer-facing catalogue
          headers:
            X-UC-Catalogue-Provenance:
              description: woocommerce-published when publicationSafe is true and the full published catalogue was retrieved.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UcProduct" }
        "502": { description: WooCommerce catalogue temporarily unavailable }
        "503": { description: Publication-safe catalogue provider is not configured }
        "500": { description: Failed to fetch products }

  /uc/products/{id}:
    get:
      operationId: getUcProduct
      tags: [uc-admin]
      summary: Read one customer-facing product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Customer-facing product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UcProduct" }
        "404": { description: Product not found }
        "500": { description: Failed to fetch product }

  /uc/admin/products/{id}:
    patch:
      operationId: updateUcProduct
      tags: [uc-admin]
      summary: Update administrator-editable product fields
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UcProductUpdate" }
      responses:
        "200":
          description: Product fields accepted by WooCommerce
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UcProductUpdateResult" }
        "400": { description: Invalid product id or update field }
        "401": { description: Unauthorized }
        "502": { description: WooCommerce update failed or unreachable }

  /uc/admin/products/{id}/media:
    get:
      operationId: listUcProductMedia
