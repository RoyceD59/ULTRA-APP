    post:
      operationId: recoverUnsyncedRegistration
      tags: [uc-admin]
      summary: Link a durable registration to an account or create one safely
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnsyncedRegistrationRecoveryInput" }
      responses:
        "200": { description: Reconciliation result }
        "400": { description: Invalid recovery input }
        "403": { description: Admin access required }
        "404": { description: Ledger record not found }
        "409": { description: Identity conflict }

  /admin/unsynced-registrations/clear-resolved:
    post:
      operationId: clearResolvedRegistrations
      tags: [uc-admin]
      summary: Atomically clear database-persisted resolved registration records
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Number of records cleared
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties: { cleared: { type: integer, minimum: 0 } }
        "400": { description: Confirmation required }
        "403": { description: Admin access required }

