      responses:
        "200":
          description: Message queued / sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSendResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "503":
          description: WhatsApp not connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

