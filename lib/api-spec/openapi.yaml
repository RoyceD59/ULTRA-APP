      responses:
        "200":
          description: Registration ledger records
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/UnsyncedRegistration" }
        "403": { description: Admin access required }

