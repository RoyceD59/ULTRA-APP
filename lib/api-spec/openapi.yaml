      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Rotated one-time secret }
        "403": { description: Active ProjectHub administrator required }
