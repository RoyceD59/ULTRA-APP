        appRevenueKes: { type: number, minimum: 0 }
        baselineRevenueKes: { type: number, minimum: 0 }
        contributionKes: { type: number, minimum: 0 }
        treeFundKes: { type: number, minimum: 0 }
        cleanWaterKes: { type: number, minimum: 0 }
        sharedTreesFunded: { type: integer, minimum: 0 }
        growingTreePct: { type: [integer, "null"], minimum: 0, maximum: 100 }
        estimatedTreesFunded: { type: integer, minimum: 0 }
        treesPlanted: { type: [integer, "null"], minimum: 0 }
        treesEstablished: { type: [integer, "null"], minimum: 0 }
        reportDate: { type: [string, "null"] }
        location: { type: string }
        config: { $ref: "#/components/schemas/HydrateAllocationConfig" }
    CustomerReviewAssessment:
      type: object
      required: [status]
