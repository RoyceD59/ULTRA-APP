events {}

http {
  server {
    listen 5000;
    location / {
      proxy_pass http://api:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 5055;
    location / {
      proxy_pass http://hub:5055;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 3000;
    location / {
      proxy_pass http://companion:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}