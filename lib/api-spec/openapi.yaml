            utmCampaign: { type: string, maxLength: 80 }
            utmContent: { type: string, maxLength: 80 }
        answers:
          $ref: "#/components/schemas/InstantWaterAssessmentAnswers"

    AuthenticatedInstantWaterAssessmentInput:
      type: object
      additionalProperties: false
      required: [answers, idempotencyKey, firstName, phone]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        answers:
          $ref: "#/components/schemas/InstantWaterAssessmentAnswers"
        firstName:
          $ref: "#/components/schemas/InstantWaterFirstName"
        phone:
          $ref: "#/components/schemas/InstantWaterPhone"

    InstantWaterFirstName:
      type: string
      minLength: 2
      maxLength: 80
      pattern: '^(?![0-9]+$).+$'
      x-uc-validator: instant-water-first-name@1
      description: |
        Authoritative identity policy: trim the value, normalize it to Unicode NFC,
        then require 2-80 Unicode code points. The first character and every
        segment must be a Unicode letter followed only by Unicode letters or
        combining marks. Segments may be separated by exactly one ASCII space,
        straight or curly apostrophe, or hyphen. Reject punctuation-only,
        whitespace-only, numeric-only, control/separator-containing, repeated
        runs of three or more repeated characters, repeated-separator,
        leading-separator, and trailing-separator values. The portable pattern above is only a coarse numeric-only
        prefilter; x-uc-validator is authoritative when the exact Unicode and
        repetition semantics cannot be represented by standard OpenAPI.

    InstantWaterPhone:
      type: string
      minLength: 7
      maxLength: 40
      pattern: '^\+?[ () .-]*[0-9](?:[ () .-]*[0-9]){6,38}$'
      x-uc-validator: instant-water-phone@1
      description: |
         Authoritative identity policy: trim the value and normalize it to E.164
         using the selected answers.country. International values identify their
         country from the calling code; local values are interpreted in the
         selected country. Accept only possible, valid numbers for that country,
         allowing formatting characters but rejecting repeated separators,
         malformed parentheses, and mismatched country calling codes. The
         portable pattern above is only a coarse prefilter;
         x-uc-validator is authoritative.

