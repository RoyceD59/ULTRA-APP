kind = "mobile"
previewPath = "/uc-companion/"
title = "Ultra-Clear Companion"
version = "1.0.0"
id = "artifacts/uc-companion"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/uc-companion/" ]
localPort = 20002

[services.development]
run = "pnpm --filter @workspace/uc-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uc-companion", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/uc-companion", "run", "serve" ]

[services.env]
PORT = "20002"
BASE_PATH = "/uc-companion/"
METRO_PORT = "0"
