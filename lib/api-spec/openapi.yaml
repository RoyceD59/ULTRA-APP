      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { status: { type: string, enum: [suspended, revoked] } }
      responses:
        "200": { description: Client suspended or revoked }
        "403": { description: Active ProjectHub administrator required }
  /oauth/audit:
    get:
      operationId: listAgentOauthAudit
      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Audit entries }
        "403": { description: Active ProjectHub administrator required }
  /integrations/v1/monitor:
    get:
