openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: uc-admin
    description: UC companion admin operations
  - name: members
    description: Team member operations
  - name: projects
    description: Project operations
  - name: tasks
    description: Task operations
  - name: dashboard
    description: Cross-project dashboard operations
  - name: anthropic
    description: Anthropic AI chat operations
  - name: ai-monitor
    description: AI project monitoring and Ultra Clear AI integration
  - name: contacts
    description: Unified contact ledger
  - name: system
    description: System status and connectivity watchdog
  - name: notifications
    description: Notification engine and logs
  - name: webhook
    description: External webhook ingestion
  - name: whatsapp
    description: WhatsApp session management and messaging
  - name: instant-water-check
    description: Instant water assessment and physical-test lead flow
  - name: agent-oauth
    description: Private ProjectHub administrator-managed machine-agent access
paths:
  /water-check/assessments:
    post:
      operationId: createPublicInstantWaterAssessment
      tags: [instant-water-check]
      summary: Create a public instant water assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicInstantWaterAssessmentInput"
      responses:
        "201":
          description: Assessment and redacted result token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterAssessmentCreated"
        "400": { description: Invalid controlled answer or consent }
        "409": { description: Idempotency key was reused with another payload }
        "429": { description: Rate limit exceeded }

  /uc/water-check/assessments:
    post:
      operationId: createAuthenticatedInstantWaterAssessment
      tags: [instant-water-check]
      summary: Create an instant water assessment for the authenticated customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatedInstantWaterAssessmentInput"
      responses:
        "201":
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedInstantWaterAssessmentCreated"
        "400": { description: Invalid controlled answer }
        "401": { description: Authentication required }
        "409": { description: Idempotency key was reused with another payload }

  /water-check/results/{token}:
    get:
      operationId: getPublicInstantWaterAssessmentResult
      tags: [instant-water-check]
      summary: Fetch a redacted instant water result by its public token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        "200":
          description: Redacted result (contains no contact or ownership data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInstantWaterAssessmentResult"
        "404":
          description: "Result token is unknown, expired, or revoked"
        "429": { description: Rate limit exceeded }

  /water-check/assessments/{assessmentId}/verification/request:
    post:
      operationId: requestInstantWaterAssessmentVerification
      tags: [instant-water-check]
      summary: Request a phone verification code for one assessment
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterVerificationRequestInput"
      responses:
        "202":
          description: Verification request accepted without account-existence disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterVerificationRequested"
        "400": { description: Invalid channel or explicit SMS consent missing }
        "404": { description: Assessment not found }
        "429": { description: Rate limit exceeded }
        "409": { description: Delivery is already in progress for this idempotent request }
        "503": { description: Verification provider delivery failed; retry the same idempotency key }

  /water-check/assessments/{assessmentId}/verification/confirm:
    post:
      operationId: confirmInstantWaterAssessmentVerification
      tags: [instant-water-check]
      summary: Confirm the short-lived phone verification code
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterVerificationConfirmInput"
      responses:
        "200":
          description: Verification accepted and scoped action token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterVerificationConfirmed"
        "400": { description: Invalid or expired code }
        "404": { description: Assessment not found }
        "429": { description: Too many attempts }

  /water-check/handoff/consume:
    post:
      operationId: consumeInstantWaterAssessmentHandoff
      tags: [instant-water-check]
      summary: Securely attach a verified unmatched assessment to the signed-in customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterAssessmentHandoffConsumeInput"
      responses:
        "200":
          description: Assessment attached to the authenticated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterAssessment"
        "400": { description: Invalid handoff token input }
        "401": { description: Authentication required }
        "403": { description: "Invalid, expired, revoked, consumed, mismatched, or already attached handoff" }

  /uc/water-check/assessments/{assessmentId}/attach:
    post:
      operationId: attachInstantWaterAssessment
      tags: [instant-water-check]
      summary: Attach one verified public assessment to the signed-in customer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterAssessmentAttachInput"
      responses:
        "200":
          description: Assessment attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterAssessment"
        "401": { description: Authentication required }
        "403": { description: Verification or ownership proof required }
        "404": { description: Assessment not found }
        "409": { description: Assessment has an ambiguous or newer account state }

  /uc/water-check/assessments/{assessmentId}/physical-test:
    post:
      operationId: requestInstantWaterPhysicalTest
      tags: [instant-water-check]
      summary: Request the physical-test stage on the existing assessment ticket
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantWaterPhysicalTestRequestInput"
      responses:
        "200":
          description: Existing assessment and ticket transitioned atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterPhysicalTestResponse"
        "400": { description: Invalid service details or media reference }
        "401": { description: Authentication or assessment action token required }
        "404": { description: Assessment not found }
        "409": { description: Stale transition or market unavailable }

  /uc/me/water-check/assessments:
    get:
      operationId: listAuthenticatedInstantWaterAssessments
      tags: [instant-water-check]
      summary: List assessments owned by the authenticated customer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer-owned assessment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterAssessmentHistory"
        "401": { description: Authentication required }

  /uc/me/water-check/latest:
    get:
      operationId: getAuthenticatedLatestInstantWaterAssessment
      tags: [instant-water-check]
      summary: Get the latest owned assessment summary for Companion chat context
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Latest customer-owned assessment summary, if present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantWaterLatestSummary"
        "401": { description: Authentication required }

  /uc/admin/water-checks:
    get:
      operationId: listProjectHubInstantWaterAssessments
      tags: [instant-water-check]
      summary: List instant water assessments for ProjectHub
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: customerId
          in: query
          description: Filter to assessments attached to this customer account.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Water-check queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHubInstantWaterList"
        "401": { description: Authentication required }
        "403": { description: water_tests permission required }

  /uc/admin/water-checks/{assessmentId}:
    get:
      operationId: getProjectHubInstantWaterAssessment
      tags: [instant-water-check]
      summary: View one instant water assessment and its ticket in ProjectHub
      security: [{ bearerAuth: [] }]
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHubInstantWaterDetail"
        "403": { description: water_tests permission required }
        "404": { description: Assessment not found }
    patch:
      operationId: updateProjectHubInstantWaterAssessment
      tags: [instant-water-check]
      summary: Update an authorized operational water-test state
      security: [{ bearerAuth: [] }]
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectHubInstantWaterUpdateInput"
      responses:
        "200":
          description: Assessment state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHubInstantWaterDetail"
        "403": { description: Permission or administrator access required }
        "404": { description: Assessment not found }
        "409": { description: Stale transition }

  /uc/admin/orders/{id}/customer-stage:
    patch:
      operationId: updateUcOrderCustomerStage
      tags: [uc-admin]
      summary: Advance an order's customer-visible status and send one audited push
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UcOrderCustomerStageInput"
      responses:
        "200": { description: Stage saved (possibly idempotent repeat) }
        "400": { description: Invalid input }
        "403": { description: Admin access required }
        "404": { description: Order not found }
        "409": { description: Invalid forward transition }
  /uc/admin/water-tests/{id}/customer-stage:
    patch:
      operationId: updateUcWaterTestCustomerStage
      tags: [uc-admin]
      summary: Advance a water-test customer stage and send one audited push
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UcWaterTestCustomerStageInput"
      responses:
        "200": { description: Stage saved (possibly idempotent repeat) }
        "400": { description: Invalid input or missing result delivery reference }
        "403": { description: Admin access required }
        "404": { description: Water test not found }
        "409": { description: Invalid forward transition }
  /uc/admin/inventory:
    get:
      operationId: listUcInventory
      tags: [uc-admin]
      summary: List all UC products with live stock from WooCommerce
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryList"
        "401":
          description: Unauthorized

  /uc/admin/inventory/wishlist-demand:
    get:
      operationId: listUcInventoryWishlistDemand
      tags: [uc-admin]
      summary: List product demand from active restock wishlist entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wishlist demand summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryWishlistDemand"
        "401":
          description: Unauthorized

  /uc/admin/inventory/{productId}:
    patch:
      operationId: updateUcInventoryItem
      tags: [uc-admin]
      summary: Update a product's stock quantity in WooCommerce
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryStockUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryUpdateResult"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "502":
          description: WooCommerce unreachable

  /uc/admin/inventory/sync:
    post:
      operationId: triggerUcInventorySync
      tags: [uc-admin]
      summary: Trigger the configured n8n inventory-sync webhook
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncTriggered"
        "401":
          description: Unauthorized
        "422":
          description: n8n webhook URL not configured

  /admin/integrations:
    get:
      operationId: getAdminIntegrations
      tags: [uc-admin]
      summary: Get integration settings metadata (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsSettings"
        "401":
          description: Unauthorized
    patch:
      operationId: updateAdminIntegrations
      tags: [uc-admin]
      summary: Update integration settings (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationsSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /uc/admin/customers:
    get:
      operationId: listUcCustomers
      tags: [uc-admin]
      summary: List UC Companion customers with search and date-range filter (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search by name, email, or normalized international phone number (case-insensitive)
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Registration date range start (inclusive)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Registration date range end (inclusive)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Paginated customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UcCustomerList"
        "401":
          description: Unauthorized
        "403":
          description: Admin access required

  /uc/admin/customers/export:
    get:
      operationId: exportUcCustomers
      tags: [uc-admin]
      summary: Export all UC Companion customers matching search and date filters as CSV (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search by name, email, or normalized international phone number (case-insensitive)
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Registration date range start (inclusive)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Registration date range end (inclusive)
      responses:
        "200":
          description: Filtered customer CSV
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid date filter
        "401":
          description: Unauthorized
        "403":
          description: Admin access required

  /uc/admin/customers/{customerId}:
    get:
      operationId: getUcCustomer
      tags: [uc-admin]
      summary: Get a single UC customer with their orders and tickets (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UcCustomerDetail"
        "401":
          description: Unauthorized
        "403":
          description: Admin access required
        "404":
          description: Customer not found

  /uc/admin/customers/count:
    get:
      operationId: getUcCustomersCount
      tags: [uc-admin]
      summary: Total registered UC Companion customers (non-deleted)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UcCustomersCount"
        "401":
          description: Unauthorized

  /uc/admin/users/{id}/temporary-password:
    post:
      operationId: issueUcTemporaryPassword
      tags: [uc-admin]
      summary: Issue a verified-channel, 24-hour temporary Companion password
      description: |
        Authorized ProjectHub staff may issue a temporary password only for an
        active password-authenticated Companion account. The plaintext is
        returned once to the operator and delivered through the selected
        verified channel. Only a hash is retained; the resulting customer
        session must complete a permanent password change before accessing
        Companion features.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UcTemporaryPasswordInput"
      responses:
        "200":
          description: Temporary password issued and delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UcTemporaryPasswordResult"
        "202":
          description: Legacy generic rejection response
        "400":
          description: Invalid customer id or delivery channel
        "401":
          description: Authentication required
        "403":
          description: Companion password issuance permission required
        "422":
          description: Account or selected destination is not eligible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActionableError" }
        "502":
          description: Delivery provider failed and no temporary credential remains active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActionableError" }
        "503":
          description: WhatsApp is disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActionableError" }

  /uc/admin/locations:
    get:
      operationId: listUcAdminLocations
      tags: [uc-admin]
      summary: List managed Companion service locations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Managed locations
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items: { $ref: "#/components/schemas/UcLocation" }
        "403": { description: Admin access required }
    post:
      operationId: createUcAdminLocation
      tags: [uc-admin]
      summary: Create a managed Companion service location
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UcLocationInput" }
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                type: object
                properties: { location: { $ref: "#/components/schemas/UcLocation" } }
        "400": { description: Invalid location fields }
        "403": { description: Admin access required }
  /uc/locations/{id}/ratings:
    get:
      operationId: getUcLocationRatingAggregate
      tags: [uc-admin]
      summary: Get privacy-safe community rating aggregates for a location
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: Rating aggregate, content: { application/json: { schema: { $ref: "#/components/schemas/UcLocationRatingAggregate" } } } }
  /uc/locations/{id}/rating:
    put:
      operationId: upsertUcLocationRating
      tags: [uc-admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UcLocationRatingInput" } } }
      responses:
        "200": { description: Rating saved }
        "401": { description: Authentication required }
        "400": { description: Invalid rating }
  /uc/admin/locations/{id}:
    patch:
      operationId: updateUcAdminLocation
      tags: [uc-admin]
      summary: Partially update a managed Companion service location
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UcLocationUpdateInput" }
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  location: { $ref: "#/components/schemas/UcLocation" }
                  verificationReset: { type: boolean }
        "400": { description: Empty or invalid partial update }
        "403": { description: Admin access required }
        "404": { description: Location not found }

  /uc/admin/location-rating-reports:
    get:
      operationId: listLocationRatingReports
      tags: [uc-admin]
      summary: List reports on community location ratings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Location rating reports
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports:
                    type: array
                    items:
                      type: object
                      required: [id, ratingId, reporterUserId, reason, createdAt]
                      properties:
                        id: { type: string }
                        ratingId: { type: string }
                        reporterUserId: { type: integer }
                        reason: { type: string }
                        detail: { type: string, nullable: true }
                        createdAt: { type: string }

  /uc/admin/location-ratings/{id}/moderation:
    patch:
      operationId: moderateLocationRating
      tags: [uc-admin]
      summary: Update the moderation status of a location rating
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [published, hidden, removed]
      responses:
        "200":
          description: Rating updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    required: [id, status, updatedAt]
                    properties:
                      id: { type: string }
                      status: { type: string }
                      updatedAt: { type: string }

  /uc/admin/locations/{id}/assessment:
    get:
      operationId: getLocationAssessment
      tags: [uc-admin]
      summary: Get verified location assessment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment:
                    $ref: "#/components/schemas/UcLocationAssessment"
    put:
      operationId: updateLocationAssessment
      tags: [uc-admin]
      summary: Create or update verified location assessment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
