name: Refill governance checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refill
          POSTGRES_PASSWORD: refill
          POSTGRES_DB: refill_governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refill -d refill_governance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server typecheck
      - run: pnpm --filter @workspace/projecthub typecheck
      - name: Exercise governance against isolated PostgreSQL
        working-directory: artifacts/api-server
        env:
          DATABASE_URL: postgres://refill:refill@localhost:5432/refill_governance_test
          REFILL_TEST_DB: '1'
        run: node --import tsx/esm --test src/tests/refill-governance.integration.test.ts
