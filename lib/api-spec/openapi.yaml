                  $ref: "#/components/schemas/NotificationLog"

  /notifications/dispatch:
    post:
      operationId: dispatchNotification
      tags: [notifications]
      summary: Manually dispatch a notification to a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDispatchInput"
      responses:
        "200":
          description: Dispatch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDispatchResult"

  # ─── Team Auth ───────────────────────────────────────────────────
  /auth/change-passcode:
    post:
      operationId: changePasscode
      tags: [whatsapp]
      summary: Change the team passcode
      description: |
        Verifies the current passcode (checking the DB-stored bcrypt hash first,
        then falling back to SESSION_SECRET) and stores a bcrypt hash of the new
        passcode in team_settings.  Requires a valid team-session Bearer token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasscodeInput"
      responses:
        "200":
          description: Passcode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasscodeResult"
        "400":
          description: Missing or too-short passcode
        "401":
          description: Current passcode incorrect or no valid session token

  /auth/token:
    post:
      operationId: issueTeamToken
      tags: [whatsapp]
      summary: Exchange the team passcode for a signed team-session JWT
      description: |
        Validates the passcode against SESSION_SECRET and issues a short-lived
        JWT with type "team-session".  Required before calling any WhatsApp
        management or send routes.  Returns 503 if SESSION_SECRET is not
        configured on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamTokenRequest"
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTokenResponse"
        "400":
          description: Missing passcode
        "401":
          description: Invalid passcode
        "503":
          description: Auth not configured (SESSION_SECRET missing)

  # ─── WhatsApp ────────────────────────────────────────────────────
  /whatsapp/status:
    get:
      operationId: getWhatsAppStatus
      tags: [whatsapp]
      summary: Get current WhatsApp connection state
      responses:
        "200":
          description: Current WhatsApp status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppStatus"

  /whatsapp/connect:
    post:
      operationId: connectWhatsApp
      tags: [whatsapp]
      summary: Initiate WhatsApp pairing flow
      responses:
        "200":
          description: Current WhatsApp status after connect attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppStatus"
        "503":
          description: WhatsApp could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppRequestError"

  /whatsapp/disconnect:
    post:
      operationId: disconnectWhatsApp
      tags: [whatsapp]
      summary: Log out and wipe the current WhatsApp session
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [ok, state]
                properties:
                  ok: { type: boolean }
                  state: { type: string }

  /whatsapp/send:
    post:
      operationId: sendWhatsAppQuickMessage
      tags: [whatsapp]
      summary: Send a free-form WhatsApp message to a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppSendInput"
      responses:
        "200":
          description: Message queued / sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSendResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "503":
          description: WhatsApp not connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  # ─── Webhook Ingestion ───────────────────────────────────────────
  /webhook/ingest:
    post:
      operationId: ingestWebhook
      tags: [webhook]
      summary: Receive event payloads from Team AI Embedded and other connected platforms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookIngestResult"
        "400":
          description: Validation failed

  /uc/referrals/validate:
    post:
      operationId: validateUcReferralOrPromotionCode
      tags: [uc-referrals]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "200":
          description: Explicit code validity and type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UcCodeValidation" }
        "401": { description: Authentication required }
  /uc/referrals/my-code:
    get:
      operationId: getUcReferralCode
      tags: [uc-referrals]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Authenticated account referral snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UcReferralSnapshot" }
        "401": { description: Authentication required }

  /oauth/token:
    post:
      operationId: issueAgentClientToken
      tags: [agent-oauth]
      summary: Issue a short-lived private machine-agent token
      description: Send client_id and client_secret using HTTP Basic authentication. Client secret post authentication is not accepted.
      security: [{ clientBasic: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                scope: { type: string }
      responses:
        "200": { description: Token issued, content: { application/json: { schema: { $ref: "#/components/schemas/AgentToken" } } } }
        "401": { description: Invalid client }
        "429": { description: Rate limited }
  /oauth/clients:
    get:
      operationId: listAgentOauthClients
      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Registered private clients, content: { application/json: { schema: { $ref: "#/components/schemas/AgentClientList" } } } }
        "403": { description: Active ProjectHub administrator required }
    post:
      operationId: createAgentOauthClient
      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentClientInput"
      responses:
        "201": { description: Client and one-time secret }
        "400": { description: Invalid scope list }
        "403": { description: Active ProjectHub administrator required }
  /oauth/clients/{id}/rotate:
    post:
      operationId: rotateAgentOauthClient
      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Rotated one-time secret }
        "403": { description: Active ProjectHub administrator required }
  /oauth/clients/{id}/suspend:
    post:
      operationId: suspendAgentOauthClient
      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { status: { type: string, enum: [suspended, revoked] } }
      responses:
        "200": { description: Client suspended or revoked }
        "403": { description: Active ProjectHub administrator required }
  /oauth/audit:
    get:
      operationId: listAgentOauthAudit
      tags: [agent-oauth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Audit entries }
        "403": { description: Active ProjectHub administrator required }
  /integrations/v1/monitor:
    get:
      operationId: getAgentMonitor
      tags: [agent-oauth]
      security: [{ agentBearer: [] }]
      responses:
        "200": { description: Operational health }
        "403": { description: Scope required }
  /integrations/v1/companion/users:
    get:
      operationId: listAgentCompanionUsers
      tags: [agent-oauth]
      security: [{ agentBearer: [] }]
      responses:
        "200": { description: Minimized non-deleted customer records }
  /integrations/v1/interactions:
    get:
      operationId: listAgentInteractions
      tags: [agent-oauth]
      security: [{ agentBearer: [] }]
      responses:
        "200": { description: Minimized interaction records }
  /integrations/v1/alison/feedback:
    get:
      operationId: listAgentAlisonFeedback
      tags: [agent-oauth]
      security: [{ agentBearer: [] }]
      responses:
        "200": { description: Filtered Alison feedback records }

  /uc/guides:
    get:
      operationId: listPublishedUcGuides
      tags: [uc-guides]
      summary: List published Companion installation guides
      responses:
        "200":
          description: Published guide index
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [guides]
                properties:
                  guides:
                    type: array
                    items: { $ref: "#/components/schemas/UcGuideSummary" }
        "304": { description: Not modified }
  /uc/guides/{slug}:
    get:
      operationId: getPublishedUcGuide
      tags: [uc-guides]
      summary: Get one published Companion installation guide
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Published guide
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [guide]
                properties:
                  guide: { $ref: "#/components/schemas/UcGuide" }
        "304": { description: Not modified }
        "404": { description: Guide not found }
  /uc/admin/guides:
    get:
      operationId: listUcAdminGuides
      tags: [uc-guides]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All draft and published guides
          content:
            application/json:
              schema:
                type: object
                required: [guides]
                properties:
                  guides:
                    type: array
                    items: { $ref: "#/components/schemas/UcGuideSummary" }
    post:
      operationId: createUcAdminGuide
      tags: [uc-guides]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UcGuideInput" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                required: [guide]
                properties: { guide: { $ref: "#/components/schemas/UcGuide" } }
        "400": { description: Invalid guide or media metadata }
        "403": { description: Active administrator required }
  /uc/admin/guides/{id}:
    get:
      operationId: getUcAdminGuide
      tags: [uc-guides]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Draft or published guide
          content:
            application/json:
              schema:
                type: object
                required: [guide]
                properties: { guide: { $ref: "#/components/schemas/UcGuide" } }
        "404": { description: Guide not found }
    put:
      operationId: updateUcAdminGuide
      tags: [uc-guides]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UcGuideInput" }
      responses:
        "200": { description: Guide saved }
        "400": { description: Invalid guide or media metadata }
        "403": { description: Active administrator required }
        "404": { description: Guide not found }
  /uc/admin/guides/{id}/publish:
    post:
      operationId: publishUcAdminGuide
      tags: [uc-guides]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Guide published }
        "400": { description: Guide content or media is invalid }
        "403": { description: Active administrator required }
        "404": { description: Guide not found }
  /uc/admin/guides/{id}/unpublish:
    post:
      operationId: unpublishUcAdminGuide
      tags: [uc-guides]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Guide unpublished }
        "403": { description: Active administrator required }
components:
  parameters:
    MemberId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ContactId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  securitySchemes:
    clientBasic:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    AgentToken:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        scope: { type: string }
    AgentClientInput:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        scopes:
          type: array
          items:
            type: string
            enum: [companion.monitor.read, companion.users.read, interactions.read, alison.read]
        expiresAt: { type: string, format: date-time }
    AgentClient:
      type: object
      required: [id, name, scopes, status]
      properties:
        id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, suspended, revoked] }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AgentClientList:
      type: object
      required: [clients]
      properties:
        clients: { type: array, items: { $ref: "#/components/schemas/AgentClient" } }
    UcCodeValidation:
      type: object
      required: [valid, type, discountPercent, label]
      properties:
        valid: { type: boolean }
        type: { type: [string, "null"], enum: [referral, promotion, null] }
        discountPercent: { type: integer, minimum: 0, maximum: 100 }
        label: { type: string }
    UcReferralSnapshot:
      type: object
      properties:
        code: { type: [string, "null"] }
        referredCount: { type: integer }
        conversions: { type: integer }
        creditsEarnedKes: { type: integer }
        usedReferralCode: { type: [string, "null"] }
    InstantWaterSource:
      type: string
      enum: [municipal, borehole, shallow, vendor, bottled, rain]

    InstantWaterConcern:
      type: string
      enum: [scale, taste, cloudy, skin, safety, cost]

    InstantWaterSetting:
      type: string
      enum: [home, rental, salon, office, hospitality, school, resell]

    InstantWaterAssessmentAnswers:
      type: object
      additionalProperties: false
      required: [country, area, source, concern, setting]
      properties:
        country: { type: string, minLength: 2, maxLength: 80 }
        area: { type: string, minLength: 1, maxLength: 160 }
        source: { $ref: "#/components/schemas/InstantWaterSource" }
        concern: { $ref: "#/components/schemas/InstantWaterConcern" }
        symptom:
          type: string
          enum: [none, scale, taste, cloudy, skin, safety]
        useContext:
          type: string
          enum: [drinking, cooking, bathing, mixed]
        setting: { $ref: "#/components/schemas/InstantWaterSetting" }

    PublicInstantWaterAssessmentInput:
      type: object
      additionalProperties: false
      required: [firstName, phone, consent, idempotencyKey, answers]
      properties:
        firstName:
          $ref: "#/components/schemas/InstantWaterFirstName"
        phone:
          $ref: "#/components/schemas/InstantWaterPhone"
        consent: { type: boolean, const: true }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        consentVersion: { type: string, maxLength: 40, default: instant-water-check-v1 }
        sourceAttribution:
          type: object
          additionalProperties: false
          properties:
            src: { type: string, maxLength: 80 }
            utmSource: { type: string, maxLength: 80 }
            utmMedium: { type: string, maxLength: 80 }
            utmCampaign: { type: string, maxLength: 80 }
            utmContent: { type: string, maxLength: 80 }
        answers:
          $ref: "#/components/schemas/InstantWaterAssessmentAnswers"

    AuthenticatedInstantWaterAssessmentInput:
      type: object
      additionalProperties: false
      required: [answers, idempotencyKey, firstName, phone]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        answers:
          $ref: "#/components/schemas/InstantWaterAssessmentAnswers"
        firstName:
          $ref: "#/components/schemas/InstantWaterFirstName"
        phone:
          $ref: "#/components/schemas/InstantWaterPhone"

    InstantWaterFirstName:
      type: string
      minLength: 2
      maxLength: 80
      pattern: '^(?![0-9]+$).+$'
      x-uc-validator: instant-water-first-name@1
      description: |
        Authoritative identity policy: trim the value, normalize it to Unicode NFC,
        then require 2-80 Unicode code points. The first character and every
        segment must be a Unicode letter followed only by Unicode letters or
        combining marks. Segments may be separated by exactly one ASCII space,
        straight or curly apostrophe, or hyphen. Reject punctuation-only,
        whitespace-only, numeric-only, control/separator-containing, repeated
        runs of three or more repeated characters, repeated-separator,
        leading-separator, and trailing-separator values. The portable pattern above is only a coarse numeric-only
        prefilter; x-uc-validator is authoritative when the exact Unicode and
        repetition semantics cannot be represented by standard OpenAPI.

    InstantWaterPhone:
      type: string
      minLength: 7
      maxLength: 40
      pattern: '^\+?[ () .-]*[0-9](?:[ () .-]*[0-9]){6,38}$'
      x-uc-validator: instant-water-phone@1
      description: |
         Authoritative identity policy: trim the value and normalize it to E.164
         using the selected answers.country. International values identify their
         country from the calling code; local values are interpreted in the
         selected country. Accept only possible, valid numbers for that country,
         allowing formatting characters but rejecting repeated separators,
         malformed parentheses, and mismatched country calling codes. The
         portable pattern above is only a coarse prefilter;
         x-uc-validator is authoritative.

    InstantWaterBands:
      type: object
      required: [hardness, taste, sediment, microbial]
      properties:
        hardness: { type: string, enum: [Low, Moderate, High] }
        taste: { type: string, enum: [Low, Moderate, High] }
        sediment: { type: string, enum: [Low, Moderate, High] }
        microbial: { type: string, enum: [Low, Moderate, High] }

    InstantWaterAssessmentCreated:
      type: object
      required: [assessmentId, reference, result, resultToken, resultTokenExpiresAt]
      properties:
        assessmentId: { type: string }
        reference: { type: string, pattern: "^WT-[A-Za-z0-9-]+$" }
        resultToken: { type: string, writeOnly: true }
        resultTokenExpiresAt: { type: string, format: date-time }
        result:
          $ref: "#/components/schemas/PublicInstantWaterAssessmentResult"

    AuthenticatedInstantWaterAssessmentCreated:
      type: object
      required: [assessmentId, reference, result]
      properties:
        assessmentId: { type: string }
        reference: { type: string, pattern: "^WT-[A-Za-z0-9-]+$" }
        result:
          $ref: "#/components/schemas/PublicInstantWaterAssessmentResult"

    PublicInstantWaterAssessmentResult:
      type: object
      required:
        [reference, rulesVersion, bands, summary, recommendation, disclaimer, provenance, serviceAvailable]
      properties:
        reference: { type: string }
        rulesVersion: { type: string, enum: [instant-water-check-v1] }
        bands: { $ref: "#/components/schemas/InstantWaterBands" }
        summary: { type: string }
        areaFlag:
          type: string
          enum: [none, hard_groundwater, rift_valley_fluoride]
        recommendation:
          type: object
          required: [name, explanation]
          properties:
            name: { type: string }
            explanation: { type: string }
        disclaimer: { type: string }
        provenance:
          type: string
          enum: [general_indicative, reviewed_regional_guidance]
        serviceAvailable: { type: boolean }
        physicalTestStatus: { type: string }

    InstantWaterVerificationRequestInput:
      type: object
      additionalProperties: false
      required: [channel, idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        channel: { type: string, enum: [whatsapp, sms] }
        smsConsent: { type: boolean, description: Required when channel is sms }

    InstantWaterVerificationRequested:
      type: object
      required: [accepted, channel]
      properties:
        accepted: { type: boolean }
        channel: { type: string, enum: [whatsapp, sms] }
        retryAfterSeconds: { type: integer, minimum: 0 }

    InstantWaterVerificationConfirmInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    InstantWaterVerificationConfirmed:
      type: object
      required: [verified, actionToken, actionTokenExpiresAt]
      properties:
        verified: { type: boolean }
        actionToken: { type: string, writeOnly: true }
        actionTokenExpiresAt: { type: string, format: date-time }
        accountLinkState:
          type: string
          enum: [verified_unmatched, attached, ambiguous_match]
        handoffToken:
          type: string
          writeOnly: true
          description: One-time short-lived account handoff credential, returned only for verified_unmatched.

    InstantWaterAssessmentHandoffConsumeInput:
      type: object
      additionalProperties: false
      required: [handoffToken]
      properties:
        handoffToken: { type: string, minLength: 32, maxLength: 200 }

    InstantWaterAssessmentAttachInput:
      type: object
      additionalProperties: false
      properties:
        actionToken: { type: string, writeOnly: true }
        resultToken:
          type: string
          writeOnly: true
          description: Public token may be combined with a signed-in account's already verified matching phone; it cannot authorize attachment alone.

    InstantWaterPhysicalTestRequestInput:
      type: object
      additionalProperties: false
      required: [serviceAddress, preferredContactTime, acknowledgement, idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        actionToken: { type: string, writeOnly: true }
        serviceAddress: { type: string, minLength: 5, maxLength: 300 }
        preferredContactTime: { type: string, minLength: 1, maxLength: 120 }
        acknowledgement: { type: boolean, const: true }
        mediaReferences:
          type: array
          maxItems: 7
          items:
            type: object
            required: [reference, mediaType]
            properties:
              reference: { type: string, maxLength: 300 }
              mediaType: { type: string, enum: [jpg, png, webp, mp4, mov, webm] }

    InstantWaterPhysicalTestResponse:
      type: object
      required: [assessmentId, reference, serviceState]
      properties:
        assessmentId: { type: string }
        reference: { type: string }
        serviceState:
          type: string
          enum: [instant_result_ready, follow_up_requested, physical_test_requested, scheduled, completed, closed]
        ticketId: { type: string }

    InstantWaterAssessment:
      type: object
      required: [assessmentId, reference, bands, accountLinkState, serviceState, createdAt]
      properties:
        assessmentId: { type: string }
        reference: { type: string }
        bands: { $ref: "#/components/schemas/InstantWaterBands" }
        accountLinkState: { type: string }
        serviceState: { type: string }
        createdAt: { type: string, format: date-time }

    InstantWaterAssessmentHistory:
      type: object
      required: [assessments]
      properties:
        assessments:
          type: array
          items: { $ref: "#/components/schemas/InstantWaterAssessment" }

