      tags: [whatsapp]
      summary: Log out and wipe the current WhatsApp session
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                required: [ok, state]
                properties:
                  ok: { type: boolean }
                  state: { type: string }

