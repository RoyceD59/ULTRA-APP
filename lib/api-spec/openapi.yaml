  /uc/admin/users/{id}/temporary-password:
    post:
      operationId: issueUcTemporaryPassword
      tags: [uc-admin]
      summary: Issue a verified-channel, 24-hour temporary Companion password
      description: |
        Authorized ProjectHub staff may issue a temporary password only for an
        active password-authenticated Companion account. The plaintext is
        returned once to the operator and delivered through the selected
        verified channel. Only a hash is retained; the resulting customer
        session must complete a permanent password change before accessing
        Companion features.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UcTemporaryPasswordInput"
      responses:
        "200":
          description: Temporary password issued and delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UcTemporaryPasswordResult"
        "202":
          description: Legacy generic rejection response
        "400":
          description: Invalid customer id or delivery channel
        "401":
          description: Authentication required
        "403":
          description: Companion password issuance permission required
        "422":
          description: Account or selected destination is not eligible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActionableError" }
        "502":
          description: Delivery provider failed and no temporary credential remains active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActionableError" }
        "503":
          description: WhatsApp is disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicActionableError" }

