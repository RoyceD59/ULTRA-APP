            Negative: {type: integer}
            Mixed: {type: integer}
        status:
          type: object
          required: [pending, processing, completed, failed, unavailable]
          properties:
            pending: {type: integer}
            processing: {type: integer}
            completed: {type: integer}
            failed: {type: integer}
            unavailable: {type: integer}
        disagreements: {type: integer}
    CustomerReviewLog:
      type: object
