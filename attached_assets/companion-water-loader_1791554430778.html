<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companion — Water drop loader</title>
<style>
  :root { color-scheme:dark; --water:#b7efff; --ink:#e4faff; --surface:#1683ae; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 44%,#59c6ec 0%,#2c9dcc 45%,#0c5276 100%); color:var(--ink); font-family:system-ui,sans-serif; }
  main { padding:32px; text-align:center; }
  .water-loader { border:0; padding:16px; background:transparent; color:inherit; cursor:pointer; border-radius:24px; -webkit-tap-highlight-color:transparent; }
  .water-loader:focus-visible { outline:2px solid var(--water); outline-offset:6px; }
  .water-loader svg { pointer-events:none; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
  h1 { font-size:14px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; margin:0 0 28px; }
  .water-loader { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .water-loader svg { width:clamp(180px,45vw,300px); height:auto; overflow:visible; color:var(--water); }
  .water-loader p { margin:0; font-size:14px; }
  .drop { animation:drip 1.5s linear infinite; transform-origin:72px 30px; }
  .glint { animation:shimmer 1.5s ease-in-out infinite alternate; transform-origin:72px 30px; }
  @keyframes shimmer { from { opacity:.35; transform:translateY(-1px); } to { opacity:1; transform:translateY(2px); } }
  .drop.one { animation-delay:0s; }
  .drop.two,.drop.three { display:none; }
  .ripple { transform-origin:72px 111px; animation:ripple 1.5s ease-out infinite; opacity:0; }
  .ripple.second { animation-delay:-.5s; }
  .ripple.third { animation-delay:-1s; }
  @keyframes drip {
    0% { transform:translateY(-10px) scale(.72,.9); opacity:1; }
    20% { transform:translateY(-6px) scale(.72,.92); opacity:1; }
    40% { transform:translateY(7px) scale(.7,.96); opacity:1; }
    60% { transform:translateY(29px) scale(.68,1); opacity:1; }
    80% { transform:translateY(60px) scale(.65,1.06); opacity:1; }
    93% { transform:translateY(84px) scale(.64,1.08); opacity:1; }
    97% { transform:translateY(99px) scale(.95,.33); opacity:1; }
    100% { transform:translateY(104px) scale(1.1,.06); opacity:0; }
  }
  @keyframes ripple {
    0%,70% { transform:scale(.12); opacity:0; }
    75% { transform:scale(.22); opacity:.65; }
    100% { transform:scale(1); opacity:0; }
  }
  @media(prefers-reduced-motion:reduce) {
    .drop { animation:none; transform:translateY(30px); opacity:1; }
    .drop.two,.drop.three { display:none; }
    .glint { animation:none; }
    .ripple { animation:none; transform:scale(.7); opacity:.3; }
    .ripple.second { transform:scale(1); opacity:.15; }
  }
</style>
</head>
<body>
<style>body{background:#eef9fc}body>main{display:none}.glossy-preview{width:128px;height:128px}@media(prefers-color-scheme:dark){body{background:#102e3b}}</style>
<style>.loader-display{display:flex;flex-direction:column;align-items:center;gap:18px}.loader-display .glossy-preview{width:176px;height:176px}.loading-label{margin:0;color:#24627a;font:500 15px/1.4 system-ui,sans-serif;letter-spacing:.06em}@media(prefers-color-scheme:dark){.loading-label{color:#b4deeb}}</style>
<style>
body{background:radial-gradient(ellipse at 50% 42%,#fff 0%,#f0f9fa 48%,#e3f1f4 100%);color:#174d60;padding:24px}
.loader-display{gap:0;width:min(100%,320px);text-align:center;position:relative}
.companion-name{margin:0 0 30px;font:600 11px/1.5 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#527984}
.water-stage{width:160px;height:160px;display:grid;place-items:center;margin:0 auto 28px;position:relative}
.water-stage::before{content:"";position:absolute;inset:12px -20px -18px;border-radius:50%;background:radial-gradient(ellipse at 50% 78%,#49a9bf14,transparent 65%);pointer-events:none}
.loader-display .glossy-preview{width:160px;height:160px;position:relative}
.loading-label{font:500 18px/1.4 system-ui,sans-serif;letter-spacing:.015em;color:#174d60}
.loading-detail{margin:9px 0 0;font:400 13px/1.6 system-ui,sans-serif;color:#587884}
.motion-control{margin:28px auto 0;min-height:44px;padding:10px 16px;border:1px solid #2c72851f;border-radius:24px;background:#ffffff60;color:#527984;font:500 12px/1.4 system-ui,sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
.motion-control:hover{background:#fff;border-color:#2c728550}.motion-control:focus-visible{outline:2px solid #238baa;outline-offset:4px}
@media(max-width:380px){.water-stage{margin-bottom:20px}.companion-name{margin-bottom:20px}}
@media(prefers-color-scheme:dark){body{background:radial-gradient(ellipse at 50% 42%,#163e4d,#0b202b 75%);color:#d4edf3}.loading-label{color:#d4edf3}.companion-name,.loading-detail{color:#90b4c1}.motion-control{color:#a1c5d0;background:#ffffff05;border-color:#aad9e522}.motion-control:hover{background:#ffffff0c;border-color:#aad9e555}}
</style>
<section class="loader-display" aria-label="Companion loading preview">
<p class="companion-name">Companion</p>
<div class="water-stage"><img class="glossy-preview" id="companion-motion" src="companion-water-loader.svg?v=companion-5" width="160" height="160" alt="" aria-hidden="true"></div>
<div role="status" aria-live="polite"><p class="loading-label">Loading</p></div>
<p class="loading-detail">A moment to refresh.</p>
<button class="motion-control" id="motion-control" type="button" aria-pressed="false">Pause animation</button>
</section>
<script>
(() => {
  const picture = document.getElementById('companion-motion');
  const control = document.getElementById('motion-control');
  let paused = false;
  control.addEventListener('click', () => {
    paused = !paused;
    picture.src = paused ? 'companion-water-loader-static.svg' : 'companion-water-loader.svg?v=companion-5';
    control.textContent = paused ? 'Play animation' : 'Pause animation';
    control.setAttribute('aria-pressed', String(paused));
  });
})();
</script>
<main>
  <!-- Mount only while a real request is pending; unmount on success or error. -->
  <span class="sr-only" role="status">Loading your Companion…</span>
  <button class="water-loader" type="button" aria-label="Speed up falling droplets">
    <svg viewBox="0 0 144 144" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="glass-edge" x1="60" y1="28" x2="84" y2="36" gradientUnits="userSpaceOnUse">
          <stop stop-color="#07658e"/><stop offset=".25" stop-color="#b3f2ff"/><stop offset=".48" stop-color="#1d9cc7"/><stop offset=".76" stop-color="#efffff"/><stop offset="1" stop-color="#086587"/>
        </linearGradient>
        <radialGradient id="glass" cx=".58" cy=".78" r=".75">
          <stop stop-color="#ccfaff" stop-opacity=".95"/><stop offset=".35" stop-color="#69d4f4" stop-opacity=".8"/><stop offset=".7" stop-color="#1599c6" stop-opacity=".45"/><stop offset="1" stop-color="#065d86" stop-opacity=".85"/>
        </radialGradient>
        <g id="glossy-drop">
          <path d="M72 8C70 20 59 29 59 37a13 13 0 0 0 26 0C85 29 75 20 72 8Z" fill="url(#glass)" stroke="url(#glass-edge)" stroke-width="1.3"/>
          <path d="M71 17C69 25 63 31 62 37" fill="none" stroke="#d9faff" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M75 22C79 29 82 34 82 39" fill="none" stroke="white" stroke-opacity=".9" stroke-width="1.25" stroke-linecap="round"/>
          <path d="M62 40C66 49 77 50 82 41" fill="none" stroke="#ddfbff" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M65 44C68 47 75 48 79 44" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width=".65"/>
          <path class="glint" d="M63 26v7m-3-3.5h6" stroke="white" stroke-width=".6" stroke-linecap="round"/>
        </g>
        <linearGradient id="water" x1="62" y1="15" x2="83" y2="46" gradientUnits="userSpaceOnUse">
          <stop stop-color="currentColor" stop-opacity=".55"/>
          <stop offset="1" stop-color="currentColor"/>
        </linearGradient>
      </defs>
      <g class="drop one">
        <use href="#glossy-drop"/>
      </g>
      <g class="drop two">
        <use href="#glossy-drop"/>
      </g>
      <g class="drop three">
        <use href="#glossy-drop"/>
      </g>
    </svg>
  </button>
</main>
<script>
  const loader = document.querySelector('.water-loader');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let resetTimer;
  loader.addEventListener('click', () => {
    if (reducedMotion.matches) return;
    clearTimeout(resetTimer);
    loader.getAnimations({ subtree: true }).forEach(animation => animation.updatePlaybackRate(1.8));
    resetTimer = setTimeout(() => {
      loader.getAnimations({ subtree: true }).forEach(animation => animation.updatePlaybackRate(1));
    }, 1400);
  });
</script>
</body>
</html>
